# Layer 1 — leaf action (no internal SocketDev refs). Consumed by
# `setup-and-install` (Layer 2b) + `_local-not-for-reuse-*.yml` (Layer 4).
# When this file bumps, the cascade is: 2b → 3 → 4 → external repos.
# See updating-workflows skill at .claude/skills/updating-workflows/.
#
# Checkout is INLINE git-fetch here — no third-party actions/checkout@sha: git
# init + a non-persisting auth-header fetch + checkout FETCH_HEAD, covering the
# ref / working-directory / fetch-depth / persist-credentials=false inputs and
# the pull_request merge ref (github.ref is refs/pull/<N>/merge on a PR). Two
# forms of the same shape exist: this composite (used once the workspace is
# populated) and an inline `run:` bootstrap in a job's FIRST step — that step
# cannot call this local composite, since nothing is checked out yet for GitHub
# to resolve `./.github/actions/*` from.
#
# cascade-data-deps: ., .github, .github/actions/fleet/_shared
# (read at runtime via ${GITHUB_ACTION_PATH}/../… — implicit edges with no
# `uses:` line; action-pins-are-current.mts tracks them for staleness.)

name: 'Checkout'
description: 'Checkout repository with sensible defaults (fetch-depth 25, persist-credentials false)'

inputs:
  fetch-depth:
    # 25 is a CI-speed heuristic: deeper than any git operation fleet CI
    # performs (version-bump scans, changed-file walks, PR base-ref diffs)
    # while staying a small fraction of a full-history clone. Pass 0 for
    # jobs that genuinely need full history.
    description: 'Number of commits to fetch (0 = full history)'
    required: false
    default: '25'
  ref:
    description: 'Git ref to checkout'
    required: false
    default: ''
  working-directory:
    description: 'Subdirectory to check out into'
    required: false
    default: '.'
  payload-token-client-id:
    description: >-
      Client ID of the GitHub App that mints the fleet-pack-distribution read-only
      payload token — pass vars.SOCKET_PAYLOAD_CLIENT_ID. Empty (the default)
      skips the mint: a non-thin member's payload is already present, so
      "Detect thin fleet payload" below never asks for a token. A thin member
      sets this so the early hydration below can authenticate the
      `gh release download` fallback if the anonymous GHCR pull fails.
    required: false
    default: ''
  payload-token-private-key:
    description: >-
      Private key of the payload-token GitHub App — pass
      secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY. Only consumed when
      payload-token-client-id is set AND hydration is needed.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Clear git extraheader config
      shell: bash
      run: |
        # Clear any extraheader config that may cause duplicate Authorization headers.
        git config --global --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true

    - name: Checkout code
      shell: bash
      env:
        # Route every workflow-context value through env so no ${{ }} expands
        # directly into the shell body (zizmor expression-injection). The token
        # authorizes the fetch inline via `git -c …extraheader` and is NEVER
        # written to .git/config — the persist-credentials:false equivalent.
        CHECKOUT_REF: ${{ inputs.ref }}
        CHECKOUT_DEST: ${{ inputs.working-directory }}
        CHECKOUT_FETCH_DEPTH: ${{ inputs.fetch-depth }}
        GITHUB_TOKEN: ${{ github.token }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        # github.ref is the triggering ref — on a pull_request it is the merge
        # ref refs/pull/<N>/merge, so this also covers the PR-merge case.
        TRIGGER_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        DEST="${CHECKOUT_DEST:-.}"
        mkdir -p "$DEST"
        cd "$DEST"
        # git init is idempotent — safe on an already-populated workspace (a
        # first-step bootstrap runs this same shape; see the header). Re-point
        # origin without failing when it already exists.
        git init -q
        git config --local advice.detachedHead false
        git remote remove origin 2>/dev/null || true
        git remote add origin "${SERVER_URL}/${REPOSITORY}"
        # Explicit inputs.ref wins; otherwise the triggering ref.
        FETCH_REF="${CHECKOUT_REF:-${TRIGGER_REF}}"
        # fetch-depth 0 = full history + tags; >0 = shallow, tag-free (CI speed).
        if [ "${CHECKOUT_FETCH_DEPTH}" = "0" ]; then
          # Full history also fetches every branch's tracking ref: the
          # commit-history checks resolve the DEFAULT branch, and a detached
          # FETCH_HEAD-only workspace carries no origin/<branch> to resolve.
          FETCH_ARGS=(--prune --tags origin "${FETCH_REF}" '+refs/heads/*:refs/remotes/origin/*')
          # A job's first-step bootstrap fetches --depth 1, and a plain fetch
          # never widens an existing shallow boundary — full history on an
          # already-shallow workspace needs an explicit --unshallow.
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            FETCH_ARGS=(--unshallow "${FETCH_ARGS[@]}")
          fi
        else
          FETCH_ARGS=(--no-tags --prune --depth "${CHECKOUT_FETCH_DEPTH}" origin "${FETCH_REF}")
        fi
        # Inline, non-persisting auth header (persist-credentials:false equiv).
        if [ -n "${GITHUB_TOKEN}" ]; then
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
        else
          git fetch "${FETCH_ARGS[@]}"
        fi
        git checkout -q --detach FETCH_HEAD
        # Record which branch is the default. A full-history workspace serves
        # the commit-history checks, and their default-branch resolution reads
        # origin/HEAD first; `remote add` never writes it (only clone does).
        # `set-head --auto` queries the remote, so it needs the same
        # non-persisting auth header the fetch carries — anonymous, it fails
        # on a private repository and leaves origin/HEAD unset. A failure
        # prints rather than dying: only the commit-history checks consume
        # origin/HEAD, and they fail loud with their own What/Where/Fix.
        if [ "${CHECKOUT_FETCH_DEPTH}" = "0" ]; then
          if [ -n "${GITHUB_TOKEN}" ]; then
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64:-}" remote set-head origin --auto \
              || echo "::warning::set-head failed — origin/HEAD unset"
          else
            git remote set-head origin --auto \
              || echo "::warning::set-head failed — origin/HEAD unset"
          fi
        fi

    - name: Detect thin fleet payload
      # A THIN member's whole scripts/fleet/** payload ships ONLY via the
      # release bundle. Without the hydration below, it lands no earlier than
      # `pnpm install`'s `prepare` lifecycle — several steps after this one —
      # so every reader in between ("Install zizmor" below, SFW's own install
      # manifest, and whichever reader turns out to be next) would fail
      # against a tree that genuinely lacks it.
      #
      # Detect that state ONCE, from the two signals that together mean
      # "thin member, not yet hydrated": the payload's own anchor file is
      # missing, AND the dep-0 fetcher that can hydrate it is present — proof
      # this member is wired for thin distribution at all. A non-thin member
      # (payload already present) and a member carrying no fetcher (a
      # packaging bug, caught by "Install zizmor"'s own hard-fail below) both
      # read `needed=false`, so the mint + hydrate steps that follow no-op.
      id: detect-hydration
      shell: bash
      env:
        CHECKOUT_DEST: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        DEST="${CHECKOUT_DEST:-.}"
        NEEDED=false
        if [ ! -f "${DEST}/scripts/fleet/setup/external-tools.json" ] \
          && [ -f "${DEST}/scripts/repo/bootstrap/fleet.mjs" ]; then
          NEEDED=true
        fi
        echo "needed=${NEEDED}" >> "${GITHUB_OUTPUT}"

    - name: Mint fleet payload read token
      # Scoped contents:read mint for the hydration fetch below. Gated on
      # BOTH hydration actually being needed AND the caller having provisioned
      # the payload App credentials, so a non-thin checkout — most callers of
      # this action — never mints a token it has no use for. Mirrors
      # setup-and-install's own later mint (for the `pnpm install`-time
      # fetch), scoped identically (contents:read on the wheelhouse repo
      # alone) — see github-payload-app-token's own description.
      id: payload-token
      if: steps.detect-hydration.outputs.needed == 'true' && inputs.payload-token-client-id != ''
      uses: ./.github/actions/fleet/github-payload-app-token
      with:
        client-id: ${{ inputs.payload-token-client-id }}
        private-key: ${{ inputs.payload-token-private-key }}

    - name: Hydrate thin fleet payload
      # Materialize the release bundle right after checkout, before ANY
      # reader — see "Detect thin fleet payload" above. The GHCR pull inside
      # fleet.mjs is anonymous: the fleet-pack OCI artifact is published
      # PUBLIC (github-release.yml's "Push fleet-pack to GHCR" step — "so
      # members pull the bundle anonymously"), so the common case needs no
      # token at all. The token minted above only backs the
      # `gh release download` fallback fleet.mjs takes if GHCR itself is
      # unreachable, since the wheelhouse GitHub Release lives in a private
      # repo and an unauthenticated `gh` cannot read it.
      if: steps.detect-hydration.outputs.needed == 'true'
      shell: bash
      env:
        CHECKOUT_DEST: ${{ inputs.working-directory }}
        GH_TOKEN: ${{ steps.payload-token.outputs.token }}
      run: |
        set -euo pipefail
        DEST="${CHECKOUT_DEST:-.}"
        cd "${DEST}"
        if ! node scripts/repo/bootstrap/fleet.mjs; then
          echo "::error title=fleet payload hydration failed::node scripts/repo/bootstrap/fleet.mjs exited non-zero"
          {
            echo "  What:   the thin fleet payload fetch failed on a fresh checkout."
            echo "  Where:  ${DEST}/scripts/repo/bootstrap/fleet.mjs, called from checkout/action.yml."
            echo "  Saw:    a non-zero exit — see this step's own output above for the reason"
            echo "          (bundle.ref unpinned, GHCR pull AND the gh-release fallback both"
            echo "          failed, or a bundle-verification mismatch)."
            echo "  Fix:    confirm .config/repo/socket-wheelhouse.json carries a valid"
            echo "          bundle.ref, that ghcr.io/socketdev/socket-wheelhouse/fleet-pack is"
            echo "          reachable, and — if GHCR is down — that payload-token-client-id /"
            echo "          payload-token-private-key are wired through to this action."
          } >&2
          exit 1
        fi

    - name: Install zizmor
      # Auto-skip in matrix cells: zizmor has its own per-platform
      # binary support matrix (darwin-arm64, linux-x64, …), and its
      # `.github` audit is Node-version-indifferent — running it in
      # every (Node 22/24 × ubuntu/macos/windows) cell wastes runner
      # minutes and breaks on unsupported cells. `strategy.job-total`
      # is empty for non-matrix jobs and `1` for 1×1 matrices, so
      # `< 2` keeps scan-style jobs running zizmor while matrix test
      # cells silently skip. No user-facing input — preventing PR
      # authors from disabling scans via workflow inputs.
      if: strategy.job-total < 2
      shell: bash
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        # The checkout action runs while the workspace may still contain only
        # the initial .github/ sparse checkout. Keep its pins beside the action.
        TOOLS_FILE="${GITHUB_WORKSPACE}/scripts/fleet/setup/external-tools.json"
        # A THIN member's pin file used to be absent here — the payload only
        # landed five steps later, during `pnpm install`'s `prepare` lifecycle
        # — so this step soft-skipped rather than hard-failing on a state that
        # was, at the time, correct. "Hydrate thin fleet payload" above now
        # materializes the payload immediately after checkout, so by the time
        # this step runs the pin file is either already present or the job
        # already stopped there with its own What/Where/Saw/Fix. An absent
        # pin file here is therefore always a genuine packaging bug — the
        # hard failure below is the only branch left, no soft-skip.
        if [ ! -f "$TOOLS_FILE" ]; then
          echo "× fleet pin file not found at ${TOOLS_FILE} — this member is missing scripts/fleet/setup/external-tools.json; re-run the cascade." >&2
          echo "  This is a packaging bug in the fleet scaffolding, not a consumer issue. File a bug." >&2
          echo "" >&2
          echo "  Diagnostics — what's actually present at runtime:" >&2
          echo "    GITHUB_ACTION_PATH=${GITHUB_ACTION_PATH}" >&2
          echo "    ls -la \"\${GITHUB_ACTION_PATH}\":" >&2
          ls -la "${GITHUB_ACTION_PATH}" 2>&1 | sed 's/^/      /' >&2 || true
          echo "    ls -la \"\${GITHUB_ACTION_PATH}/..\" (parent — should be .github/actions/fleet/):" >&2
          ls -la "${GITHUB_ACTION_PATH}/.." 2>&1 | sed 's/^/      /' >&2 || true
          echo "    ls -la \"\${GITHUB_ACTION_PATH}/../..\" (grandparent — should be .github/actions/):" >&2
          ls -la "${GITHUB_ACTION_PATH}/../.." 2>&1 | sed 's/^/      /' >&2 || true
          echo "    ls -la \"\${GITHUB_ACTION_PATH}/../../..\" (should be .github/):" >&2
          ls -la "${GITHUB_ACTION_PATH}/../../.." 2>&1 | sed 's/^/      /' >&2 || true
          echo "    ls -la \"\${GITHUB_ACTION_PATH}/../../../..\" (should be repo root):" >&2
          ls -la "${GITHUB_ACTION_PATH}/../../../.." 2>&1 | sed 's/^/      /' >&2 || true
          exit 1
        fi
        # Read JSON values via lib/jq.mjs. See setup/action.yml for
        # the rationale (Node is universally preinstalled where jq is
        # not). The reader exits non-zero on missing/empty values, so
        # set -e turns a packaging bug here into a loud failure.
        JQ="${GITHUB_ACTION_PATH}/../_shared/jq.mjs"
        # The tools file nests entries under `tools` (current schema) or at the
        # top level (legacy flat). Probe once; an empty $NS splits away.
        NS="tools"
        node "$JQ" "$TOOLS_FILE" tools >/dev/null 2>&1 || NS=""
        ZIZMOR_VERSION="$(node "$JQ" "$TOOLS_FILE" $NS zizmor version)"
        ZIZMOR_DIR="${RUNNER_TEMP:-/tmp}/zizmor-bin"
        # zizmor upstream does NOT publish musl or win-arm64 binaries
        # — see external-tools.json zizmor._notes. On those platforms
        # we gracefully skip the install (below) and stash a sentinel
        # so the paired Audit step can detect "no zizmor available"
        # without failing the job. Skipping is preferable to hard-
        # failing because zizmor is a security audit, not a build
        # dependency: losing the audit on win-arm64 is worse than
        # failing the whole build there.
        PLATFORM_TOOL="${GITHUB_ACTION_PATH}/../_shared/platform.mjs"
        PLATFORM="$(node "$PLATFORM_TOOL")"
        # Soft-skip when zizmor upstream has no binary for this
        # platform. SOCKET_TOOL_ZIZMOR_AVAILABLE=false signals the
        # Audit step to skip cleanly. lib/jq.mjs exits non-zero when
        # the key is missing — capture that without tripping set -e.
        ASSET=""
        if ASSET_TRY="$(node "$JQ" "$TOOLS_FILE" $NS zizmor platforms "$PLATFORM" asset 2>/dev/null)"; then
          ASSET="$ASSET_TRY"
        fi
        if [ -z "$ASSET" ]; then
          echo "ℹ zizmor is not published for ${PLATFORM} at v${ZIZMOR_VERSION} — skipping audit on this runner."
          echo "  See external-tools.json zizmor._notes for the supported set."
          echo "SOCKET_TOOL_ZIZMOR_AVAILABLE=false" >> "${GITHUB_ENV:-/dev/null}"
          exit 0
        fi
        INTEGRITY="$(node "$JQ" "$TOOLS_FILE" $NS zizmor platforms "$PLATFORM" integrity)"
        ZIZMOR_BIN="$ZIZMOR_DIR/zizmor"
        [[ "$ASSET" == *.zip ]] && ZIZMOR_BIN="$ZIZMOR_DIR/zizmor.exe"
        # Shared installer: fetches, integrity-verifies (SRI), extracts.
        INSTALL_TOOL="${GITHUB_ACTION_PATH}/../_shared/install-tool.mjs"
        if [ ! -x "$ZIZMOR_BIN" ]; then
          node "$INSTALL_TOOL" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${ASSET}" \
            "$INTEGRITY" \
            "$ZIZMOR_DIR"
        fi
        echo "$ZIZMOR_DIR" >> "${GITHUB_PATH:-/dev/null}"
        # Export canonical zizmor provenance in the shared SOCKET_TOOL_*
        # namespace so consumer jobs and Docker builds can reference a
        # single SOT without re-parsing external-tools.json.
        {
          echo "SOCKET_TOOL_ZIZMOR_AVAILABLE=true"
          echo "SOCKET_TOOL_ZIZMOR_VERSION=$ZIZMOR_VERSION"
          echo "SOCKET_TOOL_ZIZMOR_PLATFORM=$PLATFORM"
          echo "SOCKET_TOOL_ZIZMOR_ASSET=$ASSET"
          echo "SOCKET_TOOL_ZIZMOR_INTEGRITY=$INTEGRITY"
          echo "SOCKET_TOOL_ZIZMOR_BIN=$ZIZMOR_BIN"
          echo "SOCKET_TOOL_ZIZMOR_DIR=$ZIZMOR_DIR"
        } >> "${GITHUB_ENV:-/dev/null}"

    - name: Audit GitHub Actions
      # Paired with "Install zizmor" above; see that step's comment
      # for the rationale behind the matrix-auto-skip.
      # Also honors SOCKET_TOOL_ZIZMOR_AVAILABLE=false, which the
      # install step sets when zizmor upstream has no binary for the
      # current runner platform (linux-musl, win-arm64). Skipping
      # silently is intentional: zizmor is a security audit, not a
      # build dep, so losing audit coverage on an unsupported runner
      # is preferable to failing every build there.
      if: strategy.job-total < 2 && env.SOCKET_TOOL_ZIZMOR_AVAILABLE != 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -d .github ]; then
          # Pass --gh-token only when a token is actually present. In a local
          # agent-ci run github.token is empty, and zizmor 1.25+ treats an empty
          # `--gh-token ""` as a real token, then fatally errors ("no audit was
          # performed") when its online impostor-commit check can't reach the
          # GitHub API. Omitting the flag makes zizmor skip its online audits
          # cleanly; CI (with a real token) still runs the full online set.
          if [ -n "${GITHUB_TOKEN}" ]; then
            zizmor .github --gh-token "${GITHUB_TOKEN}" --min-severity medium
          else
            zizmor .github --min-severity medium
          fi
        fi
