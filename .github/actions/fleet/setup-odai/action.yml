name: Setup odai
description: >-
  Provision the keyless on-device AI CLI (@socketsecurity/odai) for
  summary/decision-class CI legs. Backend today: Chrome's on-device model
  through the odai chrome-builtin bridge; the action name stays
  backend-neutral because the engine changes over time. FAIL-OPEN BY
  CONTRACT: every provisioning gap — repo not opted in, non-Linux runner, no
  cached model and fills disallowed, download failure — leaves the job
  healthy with ready=false, and odai consumers clean-skip on exit 69. Gated
  per-repo on `ai.localAssist` in .config/repo/socket-wheelhouse.json.
  Measured on ubuntu-latest (SocketDev/odai runs 30828563538, 30836725578):
  cold fill ~60-75s including the ~4 GB component download, warm restore
  ~25s, inference ~15s. The model cache entry is bounded to the component
  dirs + activation state (~3.3 GB compressed) and stays fresh as long as a
  weekly consumer runs — Actions caches evict after 7 idle days, so the
  weekly AI workflow is its own warm-keeper.

inputs:
  odai-version:
    description: >-
      Exact @socketsecurity/odai version to install. The default is the
      fleet-pinned release; bump it through the template, never per-member.
    required: false
    default: '0.2.1'
  allow-fill:
    description: >-
      Permit a model fill (network download of the component) when no cached
      model restores. 'false' = restore-only; a cache miss then leaves the
      job backend-less and consumers clean-skip.
    required: false
    default: 'true'

outputs:
  ready:
    description: >-
      'true' when a backend is provisioned and consumers can prompt;
      anything else means odai legs will clean-skip (exit 69).
    value: ${{ steps.status.outputs.ready }}

runs:
  using: composite
  steps:
    # The opt-in gate. Absence of the config, the ai block, or the field all
    # read as opted-out — no repo gains an AI call it did not ask for. The
    # model runs CPU-only on Linux runners; other OSes report not-ready and
    # every consumer stays fail-open.
    - name: Read the localAssist opt-in
      id: gate
      shell: bash
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        set -euo pipefail
        ENABLED='false'
        if [ "$RUNNER_OS_NAME" = 'Linux' ]; then
          ENABLED="$(node -e '
            const fs = require("node:fs")
            let on = false
            try {
              const cfg = JSON.parse(fs.readFileSync(".config/repo/socket-wheelhouse.json", "utf8"))
              on = cfg?.ai?.localAssist === true
            } catch {}
            process.stdout.write(on ? "true" : "false")
          ')"
        fi
        echo "enabled=${ENABLED}" >> "$GITHUB_OUTPUT"

    # The image ships google-chrome-stable; install only when absent. odai
    # requires real Chrome — Chromium lacks optimization_guide_internal and
    # cannot run the on-device model.
    - name: Ensure Google Chrome stable
      if: ${{ steps.gate.outputs.enabled == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v google-chrome-stable >/dev/null 2>&1; then
          echo "preinstalled: $(google-chrome-stable --version)"
          exit 0
        fi
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb
        google-chrome-stable --version

    # Bounded cache set: the model component dirs + activation state — the
    # same set the odai bridge's clone mode copies. Never the whole profile;
    # Chrome litter would grow the entry on every refill.
    - name: Restore the on-device model cache
      id: model-cache
      if: ${{ steps.gate.outputs.enabled == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # The fleet cache restore CLI (the actions/cache port). It writes the
        # cache-matched-key step output the fill gate and readiness verdict
        # below read. This action runs after setup-and-install in the fleet
        # workflows, so the repo's node_modules resolves @actions/cache; on a
        # bare job the CLI provisions its own client into RUNNER_TEMP
        # (catalog-pinned, see scripts/fleet/cache/cache-cli.mts).
        node scripts/fleet/cache/restore.mts \
          --path '/home/runner/.cache/odai/chrome-builtin/OptGuideOnDeviceModel' \
          --path '/home/runner/.cache/odai/chrome-builtin/optimization_guide_model_store' \
          --path '/home/runner/.cache/odai/chrome-builtin/OptGuideOnDeviceClassifierModel' \
          --path '/home/runner/.cache/odai/chrome-builtin/Local State' \
          --key odai-nano-Linux-x64-restore-anchor \
          --restore-key odai-nano-Linux-x64-

    - name: Install the odai CLI
      if: ${{ steps.gate.outputs.enabled == 'true' }}
      shell: bash
      env:
        ODAI_VERSION: ${{ inputs.odai-version }}
      run: |
        set -euo pipefail
        npm install -g "@socketsecurity/odai@${ODAI_VERSION}"
        odai --help >/dev/null

    # Fill-on-miss. The component download wants ~22 GB free and Chrome
    # removes an installed model when free disk drops under 10 GB, so the
    # fill path reclaims the unused preinstalled toolchains first (~21 GB in
    # ~20s, measured). Fill failure is reported and swallowed — fail-open.
    - name: Fill the model cache (miss only)
      id: fill
      if: >-
        ${{ steps.gate.outputs.enabled == 'true' &&
            steps.model-cache.outputs.cache-matched-key == '' &&
            inputs.allow-fill == 'true' }}
      shell: bash
      env:
        ODAI_CHROME_ALLOW_DOWNLOAD: '1'
        ODAI_CHROME_USER_DATA_DIR: /home/runner/.cache/odai/chrome-builtin
      run: |
        set -euo pipefail
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        printf '%s\n' 'A cache fill primes the on-device model for later jobs.' \
          > /tmp/setup-odai-fill.txt
        FILLED='false'
        if odai summarize --input /tmp/setup-odai-fill.txt --timeout 240000 \
          > /dev/null; then
          FILLED='true'
        else
          echo "setup-odai: the model fill failed; consumers will clean-skip this run." >&2
        fi
        VERSION=''
        DIR=/home/runner/.cache/odai/chrome-builtin/OptGuideOnDeviceModel
        if [ "$FILLED" = 'true' ] && [ -d "$DIR" ]; then
          VERSION="$(ls "$DIR" | head -1)"
        fi
        echo "component-version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Save the filled model cache
      if: ${{ steps.fill.outputs.component-version != '' }}
      shell: bash
      env:
        # Route the fill output through env, never `${{ }}` inside the run
        # body — zizmor template-injection shape.
        COMPONENT_VERSION: ${{ steps.fill.outputs.component-version }}
      run: |
        set -euo pipefail
        # The fleet cache save CLI (the actions/cache port; idempotent when
        # a parallel job already saved this component version).
        node scripts/fleet/cache/save.mts \
          --path '/home/runner/.cache/odai/chrome-builtin/OptGuideOnDeviceModel' \
          --path '/home/runner/.cache/odai/chrome-builtin/optimization_guide_model_store' \
          --path '/home/runner/.cache/odai/chrome-builtin/OptGuideOnDeviceClassifierModel' \
          --path '/home/runner/.cache/odai/chrome-builtin/Local State' \
          --key "odai-nano-Linux-x64-${COMPONENT_VERSION}"

    # One readiness verdict, computed from what actually happened. Exports
    # the profile dir so consumer steps and the odai seam agree on the path.
    - name: Report readiness
      id: status
      if: ${{ always() }}
      shell: bash
      env:
        GATE_ENABLED: ${{ steps.gate.outputs.enabled }}
        RESTORED_KEY: ${{ steps.model-cache.outputs.cache-matched-key }}
        FILLED_VERSION: ${{ steps.fill.outputs.component-version }}
      run: |
        set -euo pipefail
        READY='false'
        if [ "$GATE_ENABLED" = 'true' ]; then
          if [ -n "$RESTORED_KEY" ] || [ -n "$FILLED_VERSION" ]; then
            READY='true'
            echo "ODAI_CHROME_USER_DATA_DIR=/home/runner/.cache/odai/chrome-builtin" >> "$GITHUB_ENV"
          fi
        fi
        echo "ready=${READY}" >> "$GITHUB_OUTPUT"
        echo "setup-odai ready: ${READY}"
