# Layer 1 — leaf action (no internal SocketDev refs). Consumed by
# `setup-and-install` (Layer 2b) between `setup` and `install`. When this
# file bumps, cascade is: 2b → 3 → 4 → external repos. See updating-workflows
# skill at .claude/skills/updating-workflows/.

name: 'Cache pnpm Store'
description: 'Restore the pnpm content-addressable store to skip cold downloads on every CI job and matrix cell'

# WHY THIS EXISTS:
#   The reusable ci.yml runs four jobs (check, lint, type-check, test) and
#   the test job fans out across an OS × Node matrix. `install` runs a bare
#   `pnpm install` in each — without a warm store that is a full cold fetch
#   of the dependency closure 4–10× per CI run, repeated across every fleet
#   repo. Caching the pnpm store collapses those to a single populate +
#   restores everywhere else.
#
# WHAT GETS CACHED:
#   The pnpm content-addressable store (`pnpm store path`), NOT node_modules.
#   The store is the global package cache; node_modules is linked from it on
#   each install. Caching the store (not node_modules) keeps the cache
#   lockfile-shaped and platform-portable, and lets `pnpm install` still run
#   its own integrity + link pass — it just skips the network fetch.
#
# RESTORE HERE, SAVE IN setup-and-install:
#   This action only RESTORES. The old shape used actions/cache, whose post
#   step re-evaluates `path:` at job end — outside this composite's steps
#   context — and bails with "Input required and not supplied: path"
#   (observed in run 30097714390), so the save never happened and every run
#   stayed cold. Composite step outputs are invisible to post steps, but
#   $GITHUB_ENV persists for the whole job, so this action exports
#   PNPM_STORE_PATH / PNPM_STORE_CACHE_KEY / PNPM_STORE_CACHE_HIT and
#   `setup-and-install` runs the fleet save CLI (scripts/fleet/cache/save.mts)
#   AFTER install — the point where the store is actually populated.
#
# CACHE INVALIDATION:
#   - Key includes `hashFiles('**/pnpm-lock.yaml')` — a lockfile change (new
#     or bumped dep) produces a fresh key; the previous store restores via
#     restore-keys so only the delta downloads.
#   - Keyed per `runner.os` (store layout differs by platform) and per Node
#     major (some packages ship prebuilt binaries per ABI).
#   - `cache-version` (v1) is a manual global bust knob.

inputs:
  cache-version:
    description: 'Cache version for manual global busting'
    required: false
    default: 'v1'
  key-prefix:
    description: 'Cache key prefix'
    required: false
    default: 'pnpm-store'
  working-directory:
    description: 'Working directory (where pnpm + the lockfile live)'
    required: false
    default: '.'

outputs:
  cache-hit:
    description: 'Whether an exact-key cache was restored'
    value: ${{ steps.cache.outputs.cache-hit }}
  store-path:
    description: 'Resolved pnpm store path'
    value: ${{ steps.store.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm store path and cache key
      id: store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KEY_PREFIX: ${{ inputs.key-prefix }}
        CACHE_VERSION: ${{ inputs.cache-version }}
        # Lockfile hash makes the exact key; OS + Node major partition by
        # platform/ABI; cache-version is the manual bust knob. Computed once
        # so restore and save use the byte-identical key.
        LOCKFILE_HASH: ${{ hashFiles('**/pnpm-lock.yaml') }}
      run: |
        set -euo pipefail
        # Decision core extracted to the co-located resolve-store-cache.mjs —
        # per-OS fallback chain, Node-major partition, and the byte-load-
        # bearing cache-key composition, pure functions with fixture tests in
        # the wheelhouse unit suite; this step is only the probe + invocation.
        # `pnpm store path` is authoritative — it honors store-dir config,
        # PNPM_HOME, and the platform default; the script falls back to the
        # documented per-OS default only when the query prints nothing (pnpm
        # absent would already have failed `setup`, so this is
        # belt-and-suspenders). Dependency-free .mjs on the runner's system
        # Node, reached via $GITHUB_ACTION_PATH so it travels when a member
        # consumes the action — same shape as github-status-check's probe.
        # The script writes path/major step outputs and exports
        # PNPM_STORE_PATH / PNPM_STORE_CACHE_KEY via $GITHUB_ENV (not just
        # step outputs) so the save step in setup-and-install — a different
        # composite scope — can read them.
        QUERIED_STORE_PATH="$(pnpm store path 2>/dev/null || true)"
        export QUERIED_STORE_PATH
        node "${GITHUB_ACTION_PATH}/resolve-store-cache.mjs"

    - name: Restore pnpm store
      id: cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KEY_PREFIX: ${{ inputs.key-prefix }}
        CACHE_VERSION: ${{ inputs.cache-version }}
        NODE_MAJOR: ${{ steps.store.outputs.major }}
      run: |
        set -euo pipefail
        # The fleet cache restore CLI — the native port of the
        # actions/cache/restore step over the @actions/cache package. It
        # writes the same cache-hit / cache-matched-key step outputs the
        # upstream action published, so the export step below and this
        # action's cache-hit output read them unchanged. This step runs
        # BEFORE pnpm install by design, so the CLI provisions its own
        # @actions/cache client into RUNNER_TEMP when node_modules cannot
        # resolve it yet (catalog-pinned version, see cache-cli.mts).
        # PNPM_STORE_PATH / PNPM_STORE_CACHE_KEY are job env, exported by
        # the resolve step above; the restore-key prefixes are composed
        # from env — never a GitHub expression inside the run body (zizmor
        # template-injection shape).
        node scripts/fleet/cache/restore.mts \
          --path "$PNPM_STORE_PATH" \
          --key "$PNPM_STORE_CACHE_KEY" \
          --restore-key "${KEY_PREFIX}-${CACHE_VERSION}-${RUNNER_OS}-node${NODE_MAJOR}-" \
          --restore-key "${KEY_PREFIX}-${CACHE_VERSION}-${RUNNER_OS}-"

    - name: Export cache-hit for the save step
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: | # zizmor: ignore[github-env]
        # 'true' only on an exact-key hit — the save step skips then, since
        # saving an existing key is a rejected no-op anyway.
        echo "PNPM_STORE_CACHE_HIT=${CACHE_HIT}" >> "$GITHUB_ENV"
