# Fleet-canonical composite: edit HERE in template/base and cascade.
#
# Socket-original, and it must stay that way. The third-party action it spares
# consumers from allowlisting, Swatinem/rust-cache, is LGPL-3.0 and is listed
# in COPYLEFT_UPSTREAMS as run-and-observe-only: reading its implementation
# would make this a derivative work and pull that license onto every repo the
# composite cascades into. Evolve the key strategy below against
# actions/cache's own docs and against what this action does in CI — never by
# reading that source.
#
# Take care when changing the key: a wrong key is a silent cache MISS, which
# reads as "CI got slower" rather than as a failure.

name: 'Setup Rust Cache'
description: |
  Cache the cargo registry, git index, and one or more target/ directories
  via the fleet cache CLIs (scripts/fleet/cache/{restore,save}.mts — the
  native port of the actions/cache steps over the @actions/cache package).
  Replaces the third-party `Swatinem/rust-cache` action so the consumer's
  GH Actions allowlist doesn't need `Swatinem/rust-cache@*`, and no
  third-party cache action at all.

  The cache key is computed from:
    - prefix-key (caller-supplied, distinguishes matrix slots)
    - the runner OS
    - the rustc version (so toolchain upgrades invalidate the cache)
    - the hash of each workspace's Cargo.lock

  TWO-PHASE CONTRACT (a composite has no post step to save at job end the
  way the upstream actions/cache action did): call this action once after
  the toolchain step (default `phase: restore` — computes the key, restores,
  and exports RUST_CACHE_* job env), and once more with `phase: save` as the
  job's LAST step (reads that env and saves, gated by `save-if` and skipped
  on an exact-key hit). A workflow-level step at the end of the job runs
  only when every previous step succeeded, which is the same success gate
  the upstream post step used.

inputs:
  phase:
    description: |
      'restore' (the default) computes the key, restores, and exports the
      RUST_CACHE_* job env. 'save' reads that env and saves the cache — call
      it as the job's last step. Only the restore phase reads the other
      inputs.
    required: false
    default: 'restore'
  workspaces:
    description: |
      Newline-or-space-separated list of cargo workspace paths. Required for
      the restore phase (validated there); the save phase ignores it.
      Each entry can be:
        "path"                       — caches path/target
        "path -> target-dir"         — explicit target dir relative to workspace
      Examples:
        "packages/foo"                                 (caches packages/foo/target)
        "packages/foo -> target/release/build-cache"   (explicit target dir)
    required: false
    default: ''
  prefix-key:
    description: |
      Caller-supplied cache key prefix. Combined with OS + rustc version
      to form the final key. Callers typically build it from their matrix
      axes, so each matrix slot gets its own cache entry.

      Write the value at the call site, not here: GitHub evaluates every
      expression in this file when it loads the action, and `matrix` is not
      in scope at load time — an expression written here fails the action
      for every caller, even one that never passes this input.
    required: false
    default: 'rust'
  save-if:
    description: |
      When "true" (the default) the `phase: save` call saves the cache;
      when "false" it skips, so the job only restores. Useful for matrix
      slots that only consume. Read at restore time and carried in
      RUST_CACHE_SAVE_IF, so the save call needs no inputs.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve rustc version for cache key
      id: rustc-version
      if: inputs.phase == 'restore'
      shell: bash
      run: |
        set -euo pipefail
        # rustc -V => "rustc 1.89.0 (29483883e 2025-08-04)" — strip to
        # the version + commit hash so toolchain bumps invalidate the
        # cache.
        if ! command -v rustc >/dev/null 2>&1; then
          echo "× rustc not on PATH — call setup-rust-toolchain before setup-rust-cache." >&2
          exit 1
        fi
        VERSION="$(rustc -V | awk '{print $2"-"$3}' | tr -d '()')"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "rustc version: $VERSION"

    - name: Compose target-dir list + cache key
      id: paths
      if: inputs.phase == 'restore'
      shell: bash
      env:
        WORKSPACES: ${{ inputs.workspaces }}
        PREFIX_KEY: ${{ inputs.prefix-key }}
        RUSTC_VERSION: ${{ steps.rustc-version.outputs.version }}
      run: |
        set -euo pipefail

        # workspaces went optional when the save phase arrived (a save call
        # needs no inputs), so the restore phase owns the required-ness.
        if [ -z "${WORKSPACES// /}" ]; then
          echo "× setup-rust-cache: the restore phase needs the workspaces input. Saw: empty. Fix: pass workspaces: <path> (or 'path -> target-dir')." >&2
          exit 1
        fi

        # Compose the list of paths to cache. Always include the
        # global cargo registry + git index — those are workspace-
        # independent. Then add each workspace's target dir.
        CACHE_PATHS=()
        CACHE_PATHS+=("$HOME/.cargo/registry")
        CACHE_PATHS+=("$HOME/.cargo/git")

        LOCKFILE_HASHES=""
        while IFS= read -r line; do
          # Tolerate space- or newline-separated entries.
          line="$(echo "$line" | tr -s ' ' '\n')"
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            # Entry shape: "path" or "path -> target-dir".
            if echo "$entry" | grep -q '\->'; then
              WORKSPACE_PATH="$(echo "$entry" | awk -F '->' '{print $1}' | xargs)"
              TARGET_DIR="$(echo "$entry" | awk -F '->' '{print $2}' | xargs)"
              CACHE_PATHS+=("$WORKSPACE_PATH/$TARGET_DIR")
            else
              WORKSPACE_PATH="$(echo "$entry" | xargs)"
              CACHE_PATHS+=("$WORKSPACE_PATH/target")
            fi
            # Mix the workspace's Cargo.lock into the key when present.
            if [ -f "$WORKSPACE_PATH/Cargo.lock" ]; then
              LOCK_HASH="$(sha256sum "$WORKSPACE_PATH/Cargo.lock" | awk '{print $1}')"
              LOCKFILE_HASHES="${LOCKFILE_HASHES}${LOCK_HASH:0:12}-"
            fi
          done <<<"$line"
        done <<<"$WORKSPACES"

        # Emit one path per line — actions/cache@v5 accepts that shape.
        {
          echo "paths<<EOF"
          for p in "${CACHE_PATHS[@]}"; do
            echo "$p"
          done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        # Final cache key combines prefix + os + rustc + lockfile hashes.
        # Trim trailing dash from LOCKFILE_HASHES for cleanliness.
        LOCKFILE_HASHES="${LOCKFILE_HASHES%-}"
        KEY="${PREFIX_KEY}-${RUNNER_OS}-rust-${RUSTC_VERSION}-${LOCKFILE_HASHES:-no-lock}"
        echo "key=$KEY" >> "$GITHUB_OUTPUT"
        # Restore key drops the lockfile-hash trailing chunk so a
        # rebuild on a fresh Cargo.lock can still warm from the
        # most-recent same-toolchain cache.
        echo "restore-key=${PREFIX_KEY}-${RUNNER_OS}-rust-${RUSTC_VERSION}-" >> "$GITHUB_OUTPUT"
        echo "Cache key: $KEY"

    - name: Restore cargo + target cache
      id: cache
      if: inputs.phase == 'restore'
      shell: bash
      env:
        CACHE_PATHS: ${{ steps.paths.outputs.paths }}
        CACHE_KEY: ${{ steps.paths.outputs.key }}
        RESTORE_KEY: ${{ steps.paths.outputs.restore-key }}
      run: |
        set -euo pipefail
        # The fleet cache restore CLI (the actions/cache port). Rust-only
        # jobs never run pnpm install, so the CLI provisions its own
        # @actions/cache client into RUNNER_TEMP (catalog-pinned version,
        # see scripts/fleet/cache/cache-cli.mts). Paths arrive one per line;
        # repeat --path per entry. Env-routed, never a GitHub expression
        # inside the run body (zizmor template-injection shape).
        ARGS=(--key "$CACHE_KEY" --restore-key "$RESTORE_KEY")
        while IFS= read -r cache_path; do
          [ -z "$cache_path" ] && continue
          ARGS+=(--path "$cache_path")
        done <<<"$CACHE_PATHS"
        node scripts/fleet/cache/restore.mts "${ARGS[@]}"

    - name: Export the cache verdict for the save phase
      if: inputs.phase == 'restore'
      shell: bash
      env:
        CACHE_PATHS: ${{ steps.paths.outputs.paths }}
        CACHE_KEY: ${{ steps.paths.outputs.key }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        SAVE_IF: ${{ inputs.save-if }}
      run: | # zizmor: ignore[github-env] - key/paths composed above from the caller's own inputs, not runtime-attacker data.
        # The save phase is a SECOND invocation of this composite, so step
        # outputs are out of scope there — job env is the only channel that
        # spans both, the same shape cache-pnpm-store uses for its
        # setup-and-install save step.
        {
          echo 'RUST_CACHE_PATHS<<RUST_CACHE_PATHS_EOF'
          echo "$CACHE_PATHS"
          echo 'RUST_CACHE_PATHS_EOF'
          echo "RUST_CACHE_KEY=${CACHE_KEY}"
          echo "RUST_CACHE_HIT=${CACHE_HIT}"
          echo "RUST_CACHE_SAVE_IF=${SAVE_IF}"
        } >> "$GITHUB_ENV"

    - name: Save cargo + target cache
      if: inputs.phase == 'save'
      shell: bash
      run: |
        set -euo pipefail
        # Reads the RUST_CACHE_* job env the restore phase exported. Skips
        # (with the reason) when the restore hit the exact key — saving an
        # existing key is a rejected no-op — or when the caller asked for
        # restore-only via save-if.
        if [ -z "${RUST_CACHE_KEY:-}" ]; then
          echo "× setup-rust-cache: phase 'save' found no RUST_CACHE_KEY in the job env. Saw: no restore phase ran in this job. Fix: call setup-rust-cache (default phase) after the toolchain step, then phase: save last." >&2
          exit 1
        fi
        if [ "${RUST_CACHE_SAVE_IF:-true}" != 'true' ]; then
          echo "save-if is '${RUST_CACHE_SAVE_IF}' — restore-only slot, skipping the save."
          exit 0
        fi
        if [ "${RUST_CACHE_HIT:-}" = 'true' ]; then
          echo "Exact-key cache hit on restore — the entry already exists, skipping the save."
          exit 0
        fi
        ARGS=(--key "$RUST_CACHE_KEY")
        while IFS= read -r cache_path; do
          [ -z "$cache_path" ] && continue
          ARGS+=(--path "$cache_path")
        done <<<"$RUST_CACHE_PATHS"
        node scripts/fleet/cache/save.mts "${ARGS[@]}"
