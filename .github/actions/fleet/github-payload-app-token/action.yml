name: Fleet payload read token
description: >-
  Mint a short-lived, read-only installation token from the existing PR App.
  Thin member CI uses it to download the fleet release bundle from the private wheelhouse. Scoped
  to contents:read on the payload repo only — the least privilege the bootstrap
  fetch (`gh release download` in scripts/repo/bootstrap/fleet.mjs) needs, and
  strictly narrower than the sibling github-release-app-token (contents:write).
  Fleet-shared: authored in socket-wheelhouse's template/base/universal, cascaded fleet-
  wide, and consumed via
  `uses: ./.github/actions/fleet/github-payload-app-token`.

inputs:
  client-id:
    description: 'PR App Client ID — pass vars.SOCKET_PR_CLIENT_ID.'
    required: true
  private-key:
    description: 'PR App private key — pass secrets.SOCKET_PR_APP_PRIVATE_KEY.'
    required: true
  owner:
    description: 'Org/owner that hosts the payload repo. Empty = the current repo owner.'
    required: false
    default: ''
  repositories:
    description: 'Repos to scope the token to. Defaults to the wheelhouse payload repo alone — never widen without reason.'
    required: false
    default: 'socket-wheelhouse'

outputs:
  token:
    description: 'The minted read-only installation token (pass as GH_TOKEN to the install step so the bootstrap fetch can download the private release bundle).'
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    # Socket-owned, dep-0 minter co-located with this action — runs via
    # $GITHUB_ACTION_PATH so it travels when a member consumes the action
    # cross-repo, and as plain .mjs it needs no recent runner Node. Least-
    # privilege: PERMISSIONS is the exact scope this fetch needs; zizmor doesn't
    # inspect a run-step mint, so app-tokens-are-scoped.mts is the sole gate that
    # PERMISSIONS is present + non-blank.
    # This token is contents:read ONLY, scoped to the single payload repo — it
    # downloads the fleet release bundle and nothing more. A contents:read
    # request is a subset of a contents:write app grant, so the minter's
    # preflight accepts the PR App contents grant; this token remains read-only.
    - name: Create payload app token
      id: app-token
      shell: bash
      env:
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
        CLIENT_ID: ${{ inputs.client-id }}
        OWNER: ${{ inputs.owner || github.repository_owner }}
        PERMISSIONS: '{"contents":"read"}'
        REPOSITORIES: ${{ inputs.repositories }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: node "${GITHUB_ACTION_PATH}/mint-app-installation-token.mjs"
