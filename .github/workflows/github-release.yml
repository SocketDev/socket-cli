name: 🚀 GitHub Release

# PRESET — seeded once from template/presets/ (onboarding or first cascade),
# then repo-owned: customize what THIS repo releases. The fleet base actions
# do the heavy lifting — github-release-app-token mints the release App token,
# github-release cuts the immutable 3-step release tied to the pushed tag
# (create --draft → upload assets → edit --draft=false).
#
# Default flow: push a signed v* tag → this workflow cuts a GitHub Release for
# it. A manual dispatch is a DRY-RUN (prints the cut plan) unless
# `release: true`. Add build steps + assets for whatever this repo ships.
#
# ORDER RULE: the tag + immutable GH release are the FINAL markers of a
# release — they may only exist AFTER the registry publish is live. A STAGED
# npm package is not published (staging may never be approved), so this
# workflow refuses to cut when the tagged version is not resolvable on its
# registry (npm packument / crates.io sparse index). Registry-less repos
# (private, github-release-only) skip the gate.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Cut the release for real (false = dry-run plan, the default).'
        type: boolean
        default: false
      tag:
        description: 'Tag to release. Required on dispatch (tag pushes use the pushed tag).'
        type: string
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Fleet no-phone-home posture, lockstep with the FLEET_ENV list in
# .claude/hooks/fleet/_shared/fleet-env.mts (mirror of ci.yml's env block) —
# the release job runs the same telemetry + update-notifier opt-outs, so a
# release build never phones home. OTEL_SDK_DISABLED holds the OpenTelemetry
# exporter that ships in the skillspector security tool's closure inert.
env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
  COREPACK_ENABLE_PROJECT_SPEC: '0'
  DISABLE_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  NO_UPDATE_NOTIFIER: '1'
  OTEL_SDK_DISABLED: 'true'

jobs:
  # Does this repo cut GitHub Releases at all? Read from the repo's own
  # settings, never hard-coded here: a member publishing to npm or crates.io
  # uses the release as the immutable marker its consumers and provenance
  # checks read, while a repo distributing through GHCR alone (the wheelhouse
  # and its fleet pack) would only be minting a second name for bytes nobody
  # fetches under it. Defaults to enabled, so a member that says nothing keeps
  # what it has.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Read release.github
        id: flag
        run: node scripts/fleet/release/github-release-enabled.mts
      - name: Say so when the repo opts out
        if: steps.flag.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          echo 'release.github is false in .config/repo/socket-wheelhouse.json — this repo does not cut GitHub Releases. Skipping.'

  github-release:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # First step can't call the local ./.github/actions/fleet/checkout
      # composite (nothing checked out yet); bootstrap the workspace with the
      # same inline git-fetch shape npm-publish.yml uses, so the fleet
      # checkout action below can re-check-out at its own depth.
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          # A dispatched tag input wins; otherwise the ref that triggered the run.
          FETCH_REF="${TRIGGER_REF}"
          if [ -n "${INPUT_TAG}" ]; then
            FETCH_REF="refs/tags/${INPUT_TAG}"
          fi
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${FETCH_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Checkout
        uses: ./.github/actions/fleet/checkout
        with:
          # Authorizes a thin member's bundle hydration right after checkout.
          # Both stay empty on a member with no payload App, skipping the mint.
          payload-token-client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}
      # The resolved tag is the single input every later step trusts — it
      # feeds the registry-liveness gate as TAG and names the release cut, so
      # wrong resolution here silently bypasses the publish-before-release
      # order rule. The branch logic lives in the dependency-free
      # scripts/fleet/resolve-release-tag.mjs (system Node only — no install
      # has run here), where the wheelhouse unit suite regression-tests it;
      # byte-parity with the inline predecessor is pinned per scenario.
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/fleet/resolve-release-tag.mjs
      # Belt-and-braces publish-before-release gate: refuse to cut when the
      # tagged version is not actually live on its registry. Runs only when a
      # real cut would happen (tag push, or dispatch with release: true) so a
      # dry-run plan stays inspectable pre-publish. The branch logic lives in
      # the dependency-free scripts/fleet/registry-liveness-gate.mjs (system
      # Node only — no install has run here), where the wheelhouse unit suite
      # regression-tests it; the inline predecessor was untestable and shipped
      # a regressed single-crate-only gate to cargo workspaces in v1.0.13.
      - name: Registry publish is live
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/fleet/registry-liveness-gate.mjs
      - name: Mint release-app token
        id: app-token
        uses: ./.github/actions/fleet/github-release-app-token
        with:
          client-id: ${{ vars.SOCKET_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      # Build this repo's release assets here, then list them under the cut
      # step's `assets:` (newline-separated paths; each must exist).
      - name: Cut immutable GitHub release
        uses: ./.github/actions/fleet/github-release
        with:
          tag: ${{ steps.tag.outputs.tag }}
          dry-run: ${{ (github.event_name == 'push' || inputs.release) && 'false' || 'true' }}
          token: ${{ steps.app-token.outputs.token }}
