name: 📦 npm publish

# Cascade-owned — every npm-publishing repo carries the byte-identical copy
# (adopt by copying the template once; the sync then keeps it in lock-step;
# member edits are reverted on the next cascade). The thin dispatch shell:
# checkout → setup-and-install → build → scripts/fleet/npm-publish.mts, which
# owns what + how the repo publishes.
#
# Default flow: manual dispatch, DRY-RUN unless `publish: true`; publishes the
# workspace's publishable packages via the fleet staged-publish script with
# npm provenance (OIDC trusted publishing — id-token: write, no long-lived
# npm token).
#
# ORDER RULE: this workflow only STAGES — nothing is public, and NO git tag or
# GitHub release exists yet. The tag + immutable GH release are cut LAST, by
# the local `--approve` promote (publish-pipeline.mts / npm-publish.mts
# --approve), only after the approved version is live on npm. The
# github-release workflow independently refuses to cut for a version that is
# not resolvable on the registry.
#
# BACKFILL: to republish prior content as a skipped GAP version — 1.4.3
# between a live 1.4.2 and 1.4.4 — dispatch from MAIN, where this file always
# exists, with `backfill-version` + `checkout-ref`. The checkout-ref supplies
# the CONTENT while the workflow definition stays main's. The bump/changelog
# gate is bypassed; hard gap-fill-only guards replace it (never-published
# version, lower than latest, non-latest dist-tag, content declares its own
# version) — see scripts/fleet/publish-infra/npm/backfill.mts.
#
# NAPI ADDON PATH (config-driven, conditional): `detect` reads whether the
# member's .config/repo/socket-wheelhouse.json declares a `napi` block by
# running the canonical scripts/fleet/publish-infra/napi-matrix.mts, which
# fails LOUD when the block is absent or empty. Every job below `detect` is
# gated on its `has-napi` output, so a member with no `napi` block runs only
# the `publish` (bump) job above — the addon jobs skip clean. A member WITH
# the block additionally gets `napi-matrix` (per-platform CI matrix) →
# `napi-build` (native `.node` build per platform) → `napi-publish` (stage the
# generated platform packages and publish). The napi-build/napi-publish step
# shapes are stuie's current addon toolchain (abitious + a socket-btm
# opentui prebuilt) — the first and so far only fleet napi-addon member; a
# future second member with a different native toolchain may need its own
# override until this shape generalizes further.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real (false = dry-run, the default).'
        type: boolean
        default: false
      dist-tag:
        description: 'npm dist-tag to publish under.'
        type: string
        default: 'latest'
      release-as:
        description: >-
          Force the bump level. MAJOR is never derived from commits — the
          bump script stops on breaking commits unless a human selects
          major here.
        type: choice
        options:
          - ''
          - major
          - minor
          - patch
        default: ''
      bump:
        description: >-
          Run the CI bump step: consume the committed version hint, write
          CHANGELOG, and commit via the release App before staging. The
          publish pipeline dispatches with false — its bump stage already
          landed the bump commit, and a re-entrant CI bump once committed a
          duplicate CHANGELOG section. Ignored by backfills, which never
          bump.
        type: boolean
        default: true
      backfill-version:
        description: >-
          Backfill a never-published GAP version below registry latest with
          the content at checkout-ref. Bypasses the bump/changelog gate
          behind hard gap-fill-only guards; requires checkout-ref and a
          non-latest dist-tag.
        type: string
        default: ''
      checkout-ref:
        description: >-
          Backfill only — the branch/tag/SHA whose CONTENT is republished.
          The workflow definition always comes from the dispatched ref,
          main, so historical content stays reachable.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's trusted-publisher config pins this GitHub environment name; the
    # OIDC token exchange 404s if the job runs outside it.
    environment: npm-publish
    permissions:
      contents: read
      # npm provenance / trusted publishing mints its OIDC token here.
      id-token: write
    env:
      # Socket Firewall + CLI auth for the sfw-wrapped setup + pnpm install —
      # sfw and socket-cli read SOCKET_API_KEY from the org-wide secret.
      SOCKET_API_KEY: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
    steps:
      # First step must be the third-party actions/checkout (GitHub fetches it
      # independently) to populate the workspace so the LOCAL
      # ./.github/actions/* composite resolves; setup-and-install re-checks-out
      # at its own deeper default.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          # Backfill checks out the content ref; empty = the dispatched ref.
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1
          # The bump derivation anchors on registry-latest + the last v-tag.
          # On a first-publish repo the registry has nothing, so the tags are
          # the only anchor — a tagless shallow checkout makes the engine
          # derive from zero (0.1.0) and trip the half-applied-bump gate on
          # historical CHANGELOG sections that describe shipped versions.
          fetch-tags: true
          persist-credentials: false
      - name: Setup + install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          # Forward the backfill content ref — setup-and-install re-checks-out
          # internally (fleet checkout falls back to the TRIGGERING ref when
          # unset), which would silently swap the backfill content back to
          # main's tree; the backfill gate then refuses against main's
          # version. Empty forwards as unset, so normal dispatches keep the
          # dispatched-ref re-checkout.
          checkout-ref: ${{ inputs.checkout-ref }}
      # Build dist/ before publishing — the staged-publish script imports the
      # package's own built output (`@socketsecurity/lib/stdio/prompts` self-
      # resolves to dist/), and `files` ships dist/, so the tarball needs it.
      - name: Build
        run: pnpm run build
      # The release App signs the bump commit via the GitHub API — the
      # workflow's own GITHUB_TOKEN stays contents: read. A backfill never
      # commits a bump, and a bump=false pipeline dispatch already carries
      # its bump commit, so both skip the mint.
      - name: Mint release App token
        if: ${{ inputs.backfill-version == '' && inputs.bump }}
        id: release-app
        uses: ./.github/actions/fleet/github-release-app-token
        with:
          client-id: ${{ vars.SOCKET_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      # --bump consumes the committed version hint (X.Y.Z-prerelease →
      # X.Y.Z), writes CHANGELOG, and commits via the release App (verified,
      # signed) onto a throwaway npm-publish-v<version> branch — main's ref is
      # fast-forwarded to that exact commit only after the publish succeeds, and
      # the branch is nuked on a rejected publish, so a failed stage never
      # creeps the version. The bump NEVER goes through a pull request: the
      # release App's contents:write lands it directly. The version decision
      # stays with the human: it is whatever the committed hint names.
      # The bump runs EXACTLY ONCE across the pipeline + workflow chain: the
      # publish pipeline dispatches with bump=false because its own bump stage
      # already landed the bump commit — the CI re-bump once re-derived the
      # same version and committed a duplicate CHANGELOG section. Manual
      # dispatches keep the default bump=true hint-consuming flow.
      # Backfill swaps --bump for --backfill + --checkout-ref: no bump commit,
      # no changelog — the checked-out content publishes as-is once the
      # backfill guards pass (npm-publish.mts fails loud when they don't).
      - name: Publish
        env:
          BACKFILL_VERSION: ${{ inputs.backfill-version }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DIST_TAG: ${{ inputs.dist-tag }}
          RELEASE_AS: ${{ inputs.release-as }}
          RELEASE_APP_TOKEN: ${{ steps.release-app.outputs.token }}
        # CHECKOUT_REF forwards on its own so a checkout-ref dispatch WITHOUT
        # backfill-version is refused by the script instead of silently
        # bump-publishing historical content.
        run: node scripts/fleet/npm-publish.mts --staged ${{ (inputs.backfill-version == '' && inputs.bump) && '--bump' || '' }} --tag "$DIST_TAG" ${RELEASE_AS:+--release-as "$RELEASE_AS"} ${BACKFILL_VERSION:+--backfill "$BACKFILL_VERSION"} ${CHECKOUT_REF:+--checkout-ref "$CHECKOUT_REF"} ${{ inputs.publish != true && '--dry-run' || '' }}

  # Reads the member's napi config, never builds or publishes anything.
  # napi-matrix.mts exits non-zero when .config/repo/socket-wheelhouse.json
  # carries no recognized `napi.platforms` — that failure IS the "not an
  # addon member" signal the jobs below key off, not an error to surface.
  detect:
    runs-on: ubuntu-latest
    outputs:
      has-napi: ${{ steps.detect.outputs.has-napi }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: detect
        name: Detect napi addon config
        run: |
          if node scripts/fleet/publish-infra/napi-matrix.mts --print-matrix >/dev/null 2>&1; then
            echo "has-napi=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-napi=false" >> "$GITHUB_OUTPUT"
          fi

  napi-matrix:
    needs: detect
    if: needs.detect.outputs.has-napi == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (2026-05-15)
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: gen
        name: Derive napi build matrix
        run: echo "matrix=$(node scripts/fleet/publish-infra/napi-matrix.mts --print-matrix)" >> "$GITHUB_OUTPUT"

  napi-build:
    needs: [detect, napi-matrix]
    if: needs.detect.outputs.has-napi == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.napi-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      # The abi producer version installed from crates.io on every leg.
      ABITIOUS_VERSION: 0.1.0
      # socket-btm build the opentui prebuilts come from; update via
      # scripts/update-from-upstream.mts, which prints the newest tag.
      OPENTUI_BUILD_TAG: opentui-20260424-18f0f46
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (2026-06-29)
        with:
          persist-credentials: false
      - uses: ./.github/actions/fleet/setup-and-install
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # stable (2026-07-24)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 (2026-07-24)
      - name: Prefer rustup cargo over the sfw shim
        shell: bash
        # The SFW proxy MITMs crates.io, and on Windows schannel rejects its
        # certificate ("revocation status is unknown"), breaking every cargo
        # network operation. Front-load the rustup toolchain dir so cargo
        # runs unshimmed; crate installs stay --locked.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install abi (crates.io)
        shell: bash
        run: cargo install abitious --version "$ABITIOUS_VERSION" --locked
      - name: Fetch opentui prebuilt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_ID: ${{ matrix.platformId }}
        # Exact-name download: socket-btm names each prebuilt asset
        # `<tag>-<platformId>.node`, which downloadSocketBtmRelease's generic
        # binary naming (`<tool>-<platformId>`, no tag infix or extension)
        # cannot resolve — fetch the asset directly by its exact name.
        run: |
          set -euo pipefail
          FINAL="packages/core/build/dev/${PLATFORM_ID}/out/Final"
          mkdir -p "$FINAL"
          gh release download "$OPENTUI_BUILD_TAG" -R SocketDev/socket-btm \
            --pattern "${OPENTUI_BUILD_TAG}-${PLATFORM_ID}.node" \
            --output "$FINAL/opentui.node"
          test -s "$FINAL/opentui.node" || {
            echo "× opentui.node missing at $FINAL after the prebuilt fetch." >&2
            exit 1
          }
      - name: Build abitious stub
        shell: bash
        # `abi build --compress` needs the self-loader stub cdylib. The
        # @abitious/* npm platform packages (its auto-resolve source) are not
        # published yet, so build the stub from the pinned abitious tag and
        # hand it to `--stub`. Cloned into the workspace so cargo paths stay
        # native on every runner OS.
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "v${ABITIOUS_VERSION}" \
            https://github.com/SocketDev/abitious abitious-src
          cargo build --manifest-path abitious-src/Cargo.toml -p abitious-stub --release
      - name: Build + compress stuie.node
        shell: bash
        env:
          PLATFORM_ID: ${{ matrix.platformId }}
        run: |
          set -euo pipefail
          case "$PLATFORM_ID" in
            darwin-*) STUB_FILE=libabitious_stub.dylib ;;
            win-*)    STUB_FILE=abitious_stub.dll ;;
            *)        STUB_FILE=libabitious_stub.so ;;
          esac
          abi build --compress --release -p stuie-node \
            --stub "abitious-src/target/release/${STUB_FILE}"
          FINAL="packages/core/build/dev/${PLATFORM_ID}/out/Final"
          mv stuie_node.node "$FINAL/stuie.node"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 (2026-07-24)
        with:
          if-no-files-found: error
          name: addons-${{ matrix.platformId }}
          path: packages/core/build/dev/${{ matrix.platformId }}/out/Final/*.node

  napi-publish:
    needs: [detect, napi-build]
    if: needs.detect.outputs.has-napi == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish == true && 'npm-publish' || '' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 (2026-06-29)
        with:
          persist-credentials: false
      - uses: ./.github/actions/fleet/setup-and-install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (2026-07-24)
        with:
          path: staged-addons
      - name: Stage platform packages
        shell: bash
        run: |
          set -euo pipefail
          node packages/core/scripts/make-npm-dirs.mts
          for dir in staged-addons/addons-*; do
            platform_id="${dir#staged-addons/addons-}"
            dest="packages/core/npm/${platform_id}"
            test -d "$dest" || {
              echo "× no generated package dir for ${platform_id}." >&2
              exit 1
            }
            cp "$dir"/*.node "$dest/"
            ls -la "$dest"
          done
          # Never publish a platform package whose build leg staged nothing —
          # an empty @stuie/core-<platformId> would shadow the loader's
          # fallback on that platform.
          for dest in packages/core/npm/*/; do
            if [ ! -s "${dest}stuie.node" ]; then
              echo "× ${dest} has no staged stuie.node; refusing a hollow publish." >&2
              exit 1
            fi
          done
      - name: Publish (dry-run unless approved)
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          FLAGS=(--access public --no-git-checks --provenance)
          if [ "$PUBLISH" != "true" ]; then
            FLAGS+=(--dry-run)
          fi
          pnpm -r publish "${FLAGS[@]}"
