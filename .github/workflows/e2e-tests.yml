name: E2E Tests

on:
  pull_request:
    branches: [v1.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        # Node 20 reached end-of-life 2026-03-24; test supported majors only.
        node-version: [22, 24, 26.13.0]
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest] - Windows tests disbaled (see project https://linear.app/socketdev/project/autofixes-windows-support-fc2f2a45f759)
    steps:
      - name: Checkout source
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout -q --detach FETCH_HEAD

      - name: Install Node.js
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: node scripts/setup/node.mts --version "$NODE_VERSION"

      - name: Install pinned package managers
        shell: bash
        run: bash scripts/setup/release-tools.sh --keep-node

      - name: Install uv
        run: pnpm run ci:setup-uv

      - name: Set up Socket Firewall
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup/firewall.sh

      - name: Install dependencies
        run: pnpm install --loglevel error

      - name: Build
        run: pnpm run build

      - name: Run e2e tests
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }} # zizmor: ignore[secrets-outside-env]
        run: pnpm run e2e-tests
