name: E2E Tests

on:
  pull_request:
    branches: [v1.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        # Node 20 reached end-of-life 2026-03-24; test supported majors only.
        node-version: [22, 24, 26.13.0]
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest] - Windows tests disbaled (see project https://linear.app/socketdev/project/autofixes-windows-support-fc2f2a45f759)
    steps:
      - name: Checkout source
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout -q --detach FETCH_HEAD

      - name: Install pnpm
        shell: bash
        run: | # zizmor: ignore[github-env]
          PNPM_VERSION="12.21.0"
          PNPM_DIR="${RUNNER_TEMP:-/tmp}/pnpm-bin"
          KERNEL="$(uname -s | cut -d- -f1)"
          ARCH="$(uname -m)"
          case "${KERNEL}-${ARCH}" in
            Linux-x86_64)                     ASSET="pnpm-linux-x64.tar.gz"    ; EXPECTED_SHA256="84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410" ; PNPM_BIN="$PNPM_DIR/pnpm" ;;
            Linux-aarch64)                    ASSET="pnpm-linux-arm64.tar.gz"   ; EXPECTED_SHA256="6c5913a48c93b3a556b71c3bd9bf12c6bf9fbfbbbd2dcbd1d52a85c539751b9e" ; PNPM_BIN="$PNPM_DIR/pnpm" ;;
            Darwin-x86_64)                    ASSET="pnpm-darwin-x64.tar.gz"    ; EXPECTED_SHA256="415c05ae4262c89b8f24ca58c693be5d969856ae909c086aa06996951fca30ea" ; PNPM_BIN="$PNPM_DIR/pnpm" ;;
            Darwin-arm64)                     ASSET="pnpm-darwin-arm64.tar.gz"  ; EXPECTED_SHA256="5c4d73018e00dd602531ce714625594fb693cbe110e6719df2b043b0ae62ab1a" ; PNPM_BIN="$PNPM_DIR/pnpm" ;;
            MINGW64_NT-x86_64|MSYS_NT-x86_64) ASSET="pnpm-win32-x64.zip"       ; EXPECTED_SHA256="4fb64bb37e46c788309e0fd4ea93beb512546fdc7348121194fb704fbb72c09c" ; PNPM_BIN="$PNPM_DIR/pnpm.exe" ;;
            *) echo "Unsupported platform: ${KERNEL}-${ARCH}" >&2; exit 1 ;;
          esac
          PNPM_ARCHIVE="$PNPM_DIR/$ASSET"
          if [ ! -x "$PNPM_BIN" ]; then
            mkdir -p "$PNPM_DIR"
            curl -fsSL -o "$PNPM_ARCHIVE" "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${ASSET}"
            ACTUAL_SHA256="$( (sha256sum "$PNPM_ARCHIVE" 2>/dev/null || shasum -a 256 "$PNPM_ARCHIVE") | cut -d' ' -f1 | tr -d '\\')"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "Checksum mismatch for ${ASSET}!" >&2
              echo "  Expected: ${EXPECTED_SHA256}" >&2
              echo "  Actual:   ${ACTUAL_SHA256}" >&2
              rm -f "$PNPM_ARCHIVE"
              exit 1
            fi
            if [[ "$ASSET" == *.zip ]]; then unzip -q "$PNPM_ARCHIVE" -d "$PNPM_DIR"; else tar -xzf "$PNPM_ARCHIVE" -C "$PNPM_DIR"; fi
            chmod +x "$PNPM_BIN"
          fi
          echo "$PNPM_DIR" >> "${GITHUB_PATH:-/dev/null}"

      - name: Install Node.js
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: pnpm run ci:setup-node

      - name: Install latest npm
        shell: bash
        env:
          NPM_VERSION: 12.2.3
        run: |
          npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install uv
        run: pnpm run ci:setup-uv

      - name: Download sfw-free
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: | # zizmor: ignore[github-env]
          # Pinned version + per-platform checksum pair. Bumping sfw-free
          # requires updating SFW_FREE_VERSION AND every platform's
          # SHA256 in the same commit, otherwise the download / verify
          # steps will diverge.
          SFW_FREE_VERSION="1.16.0"
          SFW_DIR="${RUNNER_TEMP:-/tmp}/sfw-bin"
          KERNEL="$(uname -s | cut -d- -f1)"
          ARCH="$(uname -m)"
          case "${KERNEL}-${ARCH}" in
            Linux-x86_64)                      ASSET="sfw-free-linux-x86_64"       ; SFW_BIN="$SFW_DIR/sfw"     ; EXPECTED_SHA256="1f24d2628aeb3995f1f2651509e37641c7c41d07749ac68594ecb5bb2dd44d8a" ;;
            Linux-aarch64)                     ASSET="sfw-free-linux-arm64"         ; SFW_BIN="$SFW_DIR/sfw"     ; EXPECTED_SHA256="474cdb684e42d33d4b697dedd7d90c159d71380be0e53c496f0e7097c3617a6c" ;;
            Darwin-x86_64)                     ASSET="sfw-free-macos-x86_64"       ; SFW_BIN="$SFW_DIR/sfw"     ; EXPECTED_SHA256="b574931bc2b3c36a9bf07ac07b9c07894f8cd314efc91bc5e4fe1c371b56adca" ;;
            Darwin-arm64)                      ASSET="sfw-free-macos-arm64"        ; SFW_BIN="$SFW_DIR/sfw"     ; EXPECTED_SHA256="29df049df2ef705a8ce726c6c41fe73a6034f6b1cd0d87f3f15a780d074b6d83" ;;
            MINGW64_NT-x86_64|MSYS_NT-x86_64) ASSET="sfw-free-windows-x86_64.exe" ; SFW_BIN="$SFW_DIR/sfw.exe" ; EXPECTED_SHA256="fafcb65a0349ff21af4feeda170f669053efa68acb55e1b935f7ed1b2ac93ca7" ;;
            *) echo "Unsupported platform: ${KERNEL}-${ARCH}" >&2; exit 1 ;;
          esac
          if [ ! -x "$SFW_BIN" ]; then
            mkdir -p "$SFW_DIR"
            DOWNLOAD_URL="$(gh api "repos/SocketDev/sfw-free/releases/tags/v${SFW_FREE_VERSION}" \
              --jq ".assets[] | select(.name == \"$ASSET\") | .browser_download_url")"
            if [ -z "$DOWNLOAD_URL" ]; then
              echo "Asset ${ASSET} not found in SocketDev/sfw-free@v${SFW_FREE_VERSION}" >&2
              exit 1
            fi
            curl -fsSL -o "$SFW_BIN" "$DOWNLOAD_URL"
            ACTUAL_SHA256="$( (sha256sum "$SFW_BIN" 2>/dev/null || shasum -a 256 "$SFW_BIN") | cut -d' ' -f1 | tr -d '\\')"
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "Checksum mismatch for ${ASSET} (SocketDev/sfw-free@v${SFW_FREE_VERSION})!" >&2
              echo "  Expected: ${EXPECTED_SHA256}" >&2
              echo "  Actual:   ${ACTUAL_SHA256}" >&2
              rm -f "$SFW_BIN"
              exit 1
            fi
            chmod +x "$SFW_BIN"
          fi
          echo "SFW_BIN=$SFW_BIN" >> "${GITHUB_ENV:-/dev/null}"

      - name: Create sfw shims
        shell: bash
        run: | # zizmor: ignore[github-env]
          SHIM_DIR="${RUNNER_TEMP:-/tmp}/sfw-shim"
          rm -rf "$SHIM_DIR"
          mkdir -p "$SHIM_DIR"
          IS_WINDOWS=false
          [[ "$OSTYPE" == msys* || "$OSTYPE" == cygwin* ]] && IS_WINDOWS=true
          msys_to_win_path() {
            if $IS_WINDOWS && [[ "$1" =~ ^/([a-zA-Z])/(.*) ]]; then
              echo "${BASH_REMATCH[1]^^}:\\${BASH_REMATCH[2]//\//\\}"
            else
              echo "$1"
            fi
          }
          strip_shim_dir() { echo "$PATH" | tr ':' '\n' | grep -vxF "$SHIM_DIR" | paste -sd: -; }
          CLEAN_PATH="$(strip_shim_dir)"
          # https://docs.socket.dev/docs/socket-firewall-free#what-ecosystems-and-package-managers-are-supported
          for CMD in npm yarn pnpm pip uv cargo; do
            REAL="$(PATH="$CLEAN_PATH" command -v "$CMD" 2>/dev/null || true)"
            [ -z "$REAL" ] && continue
            REAL="$(msys_to_win_path "$REAL")"
            printf '%s\n' \
              '#!/bin/bash' \
              "export PATH=\"\$(echo \"\$PATH\" | tr ':' '\n' | grep -vxF '${SHIM_DIR}' | paste -sd: -)\"" \
              'export GIT_SSL_NO_VERIFY=true # Workaround: sfw-free does not yet set GIT_SSL_CAINFO.' \
              "exec \"${SFW_BIN}\" \"${REAL}\" \"\$@\"" \
              > "$SHIM_DIR/$CMD"
            chmod +x "$SHIM_DIR/$CMD"
            if $IS_WINDOWS; then
              printf '@echo off\r\nset "PATH=;%%PATH%%;"\r\nset "PATH=%%PATH:;%s;=;%%"\r\nset "PATH=%%PATH:~1,-1%%"\r\n"%s" "%s" %%*\r\n' \
                "$SHIM_DIR" "$SFW_BIN" "$REAL" > "$SHIM_DIR/$CMD.cmd"
            fi
          done
          echo "$SHIM_DIR" >> "${GITHUB_PATH:-/dev/null}"
          echo "SFW_SHIM_DIR=$SHIM_DIR" >> "${GITHUB_ENV:-/dev/null}"

      - name: Install dependencies
        run: pnpm install --loglevel error

      - name: Build
        run: pnpm run build

      - name: Run e2e tests
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }} # zizmor: ignore[secrets-outside-env]
        run: pnpm run e2e-tests
