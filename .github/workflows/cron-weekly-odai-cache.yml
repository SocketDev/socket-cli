name: 'cron: weekly odai cache'
run-name: 'cron: weekly odai cache'
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: on-device-model-cache
  cancel-in-progress: true
jobs:
  verify:
    cache-mode: read
    name: Verify public odai image
    runs-on: ${{ vars.ODAI_RUNNER || 'depot-ubuntu-24.04-4' }}
    timeout-minutes: 15
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth 1 origin "${TRIGGER_REF}"
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          checkout: 'false'
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
      - name: Verify offline model inference
        uses: ./.github/actions/fleet/setup-odai
      - name: Verify published CLI
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Summarize: fleet changes pass scoped checks before delivery.' |
            odai summarize --backend chrome-builtin --timeout 60000
