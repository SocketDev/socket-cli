name: 🧪 npm publish dry-run

# Repo-owned release-path validation — NOT cascade-owned. GitHub schedule
# events only fire from the default branch, and the v1.x line's publisher
# lives on the v1.x ref, so this cron dispatches that ref's own copy of
# npm-publish.yml with its default inputs (dry-run: true — nothing is
# tagged, released, or uploaded; the run builds all three package variants
# and stops). A red run here means the v1.x release path is broken; fix it
# BEFORE the next release needs it, not during one.
#
# The incident this exists to catch early: a publish leg can fail silently
# between releases for months when nothing exercises the path — the v1.x
# line shipped 45 releases of two packages while the third never left the
# runner.

on:
  schedule:
    # Weekly, Monday 09:17 UTC — offset from the top of the hour.
    - cron: '17 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

# One validation at a time; a queued second run adds nothing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch-v1x-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Creates the workflow_dispatch event for npm-publish.yml on v1.x.
      actions: write
    steps:
      - name: Dispatch the v1.x publish workflow in dry-run mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run npm-publish.yml --repo "$REPO" --ref v1.x
          echo "Dispatched npm-publish.yml on v1.x with default inputs (dry-run: true)."

      - name: Watch the dispatched run to completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The dispatch API returns no run id, so poll for the newest
          # npm-publish.yml run on v1.x. A concurrent hand-dispatch could
          # race this pick; for a weekly validation the wrong-run cost is a
          # duplicate watch, not a wrong verdict — both runs' verdicts
          # matter.
          sleep 20
          RUN_ID=$(gh run list --repo "$REPO" --workflow=npm-publish.yml --branch=v1.x --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "What: no npm-publish.yml run appeared on v1.x after the dispatch." >&2
            echo "Where: $REPO Actions, workflow npm-publish.yml, branch v1.x." >&2
            echo "Saw: an empty run list; wanted: the just-dispatched dry run." >&2
            echo "Fix: confirm the workflow file exists on v1.x and GITHUB_TOKEN kept actions: write." >&2
            exit 1
          fi
          echo "Watching run $RUN_ID."
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status
