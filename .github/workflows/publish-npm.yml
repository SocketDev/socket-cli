name: Publish to npm registry

# Release process for v1.x and the configured Socket prerelease. Stable v1.x
# publishes all three packages; the 2.1.0-rc track stages the native launcher and five platform packages.
#
#   1. Between releases nobody touches the version. package.json keeps the
#      last released number and user-facing notes accrue under the
#      CHANGELOG's `## [Unreleased]` section as they land.
#   2. Dispatch with mode=release-pr. The `prepare` job runs
#      scripts/release/prepare.mts to pick the next version and rewrite
#      package.json + CHANGELOG.md. With dry-run=true (the default) it only
#      prints the version. With dry-run=false the `release-pr` job commits the
#      pair via the release App onto `npm-publish-v<X.Y.Z>` and opens a
#      `chore(release): X.Y.Z` PR into this branch.
#   3. A human reviews and squash-merges the release PR. v1.x is protected, so
#      that PR is the only way a version bump reaches it.
#   4. Dispatch with mode=publish. A dry run builds, packs, and smoke-tests
#      HEAD and creates nothing. With dry-run=false the `verify` job checks out
#      the newest commit that changed package.json's version (the merged
#      release PR) and builds that. Stable v1.x owns `latest`; the prerelease
#      uses the tag declared by `.config/release.json`.
#   5. `publish` reserves the v<X.Y.Z> tag, then STAGES the exact tarballs
#      `verify` packed. It never creates a GitHub release.
#   6. A human approves each stage by ID with `pnpm run approve:npm <id>`.
#      That command checks the full package set is public, then dispatches
#      `release-github.yml` to finalize the matching GitHub release.
#
# Tags reserve versions, including burned attempts. The changelog starts at the
# last publicly released version; a first prerelease starts at the latest stable
# release. The next release must exceed every reserved version on its track.
#
# THE VERSION DECISION IS THE COMMITS'. Patch by default; a `feat:` in range
# makes it minor. A MAJOR is never derived — a breaking commit stops the bump
# and asks a human to pass release-as.
#
# CREDENTIAL BOUNDARIES. `prepare` and `verify` install and build, and hold no
# write credential of any kind. `release-pr` holds the release App token and
# runs no installed code. `publish` holds the registry credential and does
# almost nothing: no checkout, no install, no build. It publishes the exact
# bytes `verify` packed and proved, so what shipped is what was tested.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'release-pr opens the version bump PR. publish stages the newest merged release preparation.'
        required: false
        default: 'publish'
        type: choice
        options:
          - publish
          - release-pr
      dry-run:
        description: 'Defaults to true so an accidental dispatch writes nothing. release-pr: print the next version without opening a PR. publish: build everything but do NOT publish, tag, or cut a release.'
        required: false
        default: true
        type: boolean
      release-as:
        description: 'release-pr only. Force the bump level instead of deriving it from the commits. MAJOR is never derived — a breaking change stops the bump until a human picks major here.'
        required: false
        default: ''
        type: string
      release-major:
        description: 'Select the release line for a release PR or publish dry run. Choose 2 to exercise native RC packaging.'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      debug:
        description: 'Enable debug output'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build, pack, and prove every variant WITHOUT any publish credential: this
  # job binds no environment and mints no OIDC token, so nothing it runs —
  # install scripts and build tooling — can reach a token.
  # Stable builds upload all three tarballs here. For an RC, this job uploads
  # the launcher and each native host uploads its tested platform package.
  verify:
    name: Verify and pack
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    outputs:
      receipt: ${{ steps.upload.outputs.artifact-id }}:${{ steps.upload.outputs.artifact-digest }}
      sha: ${{ steps.release-meta.outputs.sha }}
      version: ${{ steps.release-meta.outputs.version }}
      dist-tag: ${{ steps.release-meta.outputs.dist-tag }}

    steps:
      # npm trusted publishing authorizes on repository + workflow filename +
      # GitHub environment. It does NOT pin a branch. The `publish-npm`
      # environment's deployment-branch policy is the outer gate; this guard
      # is the in-repo half.
      #
      # Full history locates the release commit here and anchors the changelog
      # in `prepare`. All tags expose reserved versions, including release tags
      # on bump commits that did not land.
      - &checkout-full-history
        name: Checkout source
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --tags origin "$CHECKOUT_REF" '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach FETCH_HEAD

      # A real publish ships the newest first-parent commit that changed
      # package.json's version, i.e. the merged release PR. Commits merged after
      # it wait for the next release, and a version nobody reviewed in a release
      # PR never ships. A dry run packs HEAD as it is.
      - name: Check out the release commit
        if: ${{ inputs.dry-run == false }}
        run: |
          set -euo pipefail
          for COMMIT in $(git rev-list --first-parent --max-count=500 HEAD -- package.json); do
            VERSION=$(git show "$COMMIT:package.json" | jq -r .version)
            PREVIOUS=$(git show "$COMMIT^:package.json" 2>/dev/null | jq -r .version || true)
            if [ "$VERSION" != "$PREVIOUS" ]; then
              git checkout -q --detach "$COMMIT"
              echo "Releasing $VERSION from $(git log -1 --format='%h %s')."
              exit 0
            fi
          done
          echo "::error::No commit on this branch changed the package.json version." >&2
          echo "::error::Fix: dispatch with mode=release-pr, merge that PR, then dispatch mode=publish." >&2
          exit 1

      - name: Verify the release commit before staging
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/contents/.github/scripts/verify-release.mts?ref=$GITHUB_WORKFLOW_SHA" -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/verify-release.mts"
          node "$RUNNER_TEMP/verify-release.mts" commit

      - &release-tools
        name: Install release toolchain
        shell: bash
        run: bash scripts/setup/release-tools.sh

      # Prove the pinned pnpm owns `stage` BEFORE anything else runs — from a
      # neutral cwd so the packageManager delegation cannot swap it out. Runs
      # on dry runs too, so the weekly validation catches a broken stage
      # toolchain without burning a version.
      - name: Verify the stage command resolves
        working-directory: ${{ runner.temp }}
        run: |
          pnpm --version
          pnpm stage --help > /dev/null
          echo "pnpm stage resolves via the pinned binary."

      - &setup-firewall
        name: Set up Socket Firewall
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }} # zizmor: ignore[secrets-outside-env]
        run: bash scripts/setup/firewall.sh

      - &install-dependencies
        name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --loglevel error

      - name: Resolve release metadata
        id: release-meta
        env:
          PREVIEW_NATIVE: ${{ inputs.dry-run && inputs.release-major == '2' }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$PREVIEW_NATIVE" == true ]]; then
            version=$(node --input-type=module -e 'import { SEA_VERSION } from "./src/sea/version.mts"; console.log(SEA_VERSION)')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/release/validate-npm-policy.mts "$version"

      - name: Restrict latest releases to v1.x
        if: ${{ inputs.dry-run == false && steps.release-meta.outputs.dist-tag == 'latest' }}
        env:
          REF: ${{ github.ref }}
        run: |
          node .github/scripts/verify-release.mts latest-branch

      - name: Refuse an already-published version
        if: ${{ inputs.dry-run == false }}
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: pnpm run release:preflight --version "$VERSION"

      - name: Pack native launcher
        if: contains(steps.release-meta.outputs.version, '-')
        run: pnpm pack:native root --out "$RUNNER_TEMP/dist"

      - name: Build, pack, and smoke test stable packages
        if: ${{ !contains(steps.release-meta.outputs.version, '-') }}
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
          SOCKET_CLI_DEBUG: ${{ inputs.debug }}
        run: |
          # Run tool builds directly so the firewall only wraps package-manager traffic.
          if [[ -n "${JAVA_HOME_17_X64:-}" ]]; then export JAVA_HOME="$JAVA_HOME_17_X64"; fi
          bash src/commands/manifest/scripts/maven-extension/build-jar.sh
          bash src/commands/manifest/scripts/dotnet-tool/build-tool.sh
          node .github/scripts/pin-readme-assets.mjs

          mkdir -p "$RUNNER_TEMP/dist"
          pack() {
            local package=$1
            shift
            env INLINED_SOCKET_CLI_PUBLISHED_BUILD=1 "$@" pnpm run build:dist
            pnpm pack --pack-destination "$RUNNER_TEMP/dist"
            PKG="$package" node .github/scripts/smoke-test-tarball.mts
          }
          pack socket
          pack @socketsecurity/cli INLINED_SOCKET_CLI_LEGACY_BUILD=1
          pack @socketsecurity/cli-with-sentry INLINED_SOCKET_CLI_SENTRY_BUILD=1
          git restore -- package.json

      - name: Upload verified tarballs
        id: upload
        uses: ./.github/actions/repo/upload-artifact
        with:
          name: npm-release-tarballs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist

      - name: Verify artifact transfer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RECEIPT: ${{ steps.upload.outputs.artifact-id }}:${{ steps.upload.outputs.artifact-digest }}
          VERSION: ${{ steps.release-meta.outputs.version }}
          DIST_DIRECTORY: ${{ runner.temp }}/download-check
        run: node .github/scripts/download-release-artifacts.mts

  native-packages:
    needs: verify
    if: contains(needs.verify.outputs.version, '-') && (inputs.dry-run || github.ref == 'refs/heads/v1.x')
    permissions:
      contents: read
      actions: read
    # Matrix legs export distinct keys so retries retain each successful upload.
    outputs:
      darwin-arm64: ${{ steps.receipt.outputs.darwin-arm64 }}
      linux-arm64: ${{ steps.receipt.outputs.linux-arm64 }}
      linux-x64: ${{ steps.receipt.outputs.linux-x64 }}
      win32-arm64: ${{ steps.receipt.outputs.win32-arm64 }}
      win32-x64: ${{ steps.receipt.outputs.win32-x64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-15, target: darwin-arm64 }
          - { os: windows-2025, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.verify.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: &checkout-shallow |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git checkout -q --detach FETCH_HEAD

      - *release-tools

      - *install-dependencies

      - name: Download the verified launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RECEIPT: ${{ needs.verify.outputs.receipt }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_DIRECTORY: ${{ runner.temp }}/launcher
        run: node .github/scripts/download-release-artifacts.mts

      - name: Build and test the SEA
        env:
          NODE_OPTIONS: ${{ runner.os == 'macOS' && '--max-old-space-size=4096' || '' }}
        shell: bash
        run: |
          pnpm build:sea
          pnpm test:sea

      - name: Pack verified platform binary
        shell: bash
        env:
          SOCKET_CLI_NATIVE_TEST_REQUIRE_APPLE_SIGNATURE: ${{ !inputs.dry-run && runner.os == 'macOS' && '1' || '0' }}
          APPLE_TEAM_ID: ${{ !inputs.dry-run && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12: ${{ !inputs.dry-run && runner.os == 'macOS' && secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 || '' }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS: ${{ !inputs.dry-run && runner.os == 'macOS' && secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS || '' }}
        run: pnpm pack:native platform --out "$RUNNER_TEMP/platform"

      - name: Exercise the installed native CLI
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          PKG=socket node .github/scripts/smoke-test-tarball.mts

      - name: Upload tested platform package
        id: upload
        uses: ./.github/actions/repo/upload-artifact
        with:
          name: native-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform

      - name: Record tested upload
        id: receipt
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RECEIPT: ${{ steps.upload.outputs.artifact-id }}:${{ steps.upload.outputs.artifact-digest }}
        run: echo "$TARGET=$RECEIPT" >> "$GITHUB_OUTPUT"

  rehearse:
    name: Verify staging inputs (dry run)
    needs: [verify, native-packages]
    if: ${{ !cancelled() && inputs.dry-run && needs.verify.result == 'success' && (needs.native-packages.result == 'success' || (!contains(needs.verify.outputs.version, '-') && needs.native-packages.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - &checkout-free-release-tools
        name: Install verified release toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/release-setup.XXXXXX")
          cd "$dir"
          mkdir -p scripts/setup .config src/sea
          gh api "repos/$REPOSITORY/contents/scripts/setup/release-tools.sh?ref=$GITHUB_WORKFLOW_SHA" -H 'Accept: application/vnd.github.raw+json' > scripts/setup/release-tools.sh
          for data in .config/release-tools.json src/sea/.node-version package.json; do
            gh api "repos/$REPOSITORY/contents/$data?ref=$RELEASE_SHA" -H 'Accept: application/vnd.github.raw+json' > "$data"
          done
          bash scripts/setup/release-tools.sh

      - &collect-release
        name: Download verified tarballs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_RECEIPT: ${{ needs.verify.outputs.receipt }}
          NATIVE_RECEIPTS: ${{ needs.native-packages.result == 'skipped' && '{}' || toJSON(needs.native-packages.outputs) }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_DIRECTORY: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          # Run the verifier from the workflow revision in the checkout-free staging job.
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/download-release-artifacts.mts?ref=$GITHUB_WORKFLOW_SHA" -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/download-release-artifacts.mts"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/verify-release.mts?ref=$GITHUB_WORKFLOW_SHA" -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/verify-release.mts"
          node "$RUNNER_TEMP/download-release-artifacts.mts"

  # Minimal-surface publish. This job binds the publish-npm environment and
  # mints the OIDC token, so it runs as little as possible: no repository
  # checkout, no dependency install, no build. It downloads the verified
  # tarballs, cuts the release markers, and stages those bytes.
  publish:
    name: Mark and stage
    needs: [verify, native-packages]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.native-packages.result == 'success' || (!contains(needs.verify.outputs.version, '-') && needs.native-packages.result == 'skipped')) && inputs.mode == 'publish' && inputs.dry-run == false }}
    runs-on: ubuntu-latest
    # npm's trusted-publisher config pins this GitHub environment name (npm TP
    # is PER-PACKAGE, not per-branch: the socket / @socketsecurity/cli /
    # @socketsecurity/cli-with-sentry entries point at publish-npm.yml + the
    # publish-npm environment). The OIDC token exchange 404s outside it.
    environment: publish-npm

    permissions:
      actions: read
      # `contents: write` creates the v<version> tag via gh api. The token
      # lives only in the steps that need it, and no checkout ever writes it
      # into a `.git/config`.
      contents: write
      id-token: write # npm trusted publishing via OIDC

    env:
      TAG: v${{ needs.verify.outputs.version }}
      VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - *checkout-free-release-tools
      - *collect-release

      - name: Check first-release authentication
        if: contains(needs.verify.outputs.version, '-')
        shell: bash
        env:
          BOOTSTRAP_AVAILABLE: ${{ secrets.NPM_FIRST_STAGE_TOKEN != '' }}
        run: |
          node "$RUNNER_TEMP/verify-release.mts" first-release

      - name: Reserve release tag once
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ needs.verify.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          # gh api exits non-zero on 404 (tag absent) and writes the error
          # body to stdout, so branch on the exit code — never on whether
          # stdout is empty.
          if EXISTING_JSON=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null); then
            # The ref's object is either a commit (lightweight tag) or a tag
            # object (annotated/signed). Dereference an annotated tag before
            # comparing.
            REF_TYPE=$(echo "$EXISTING_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).object.type")
            REF_OBJECT_SHA=$(echo "$EXISTING_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).object.sha")
            if [ "$REF_TYPE" = "tag" ]; then
              EXISTING_SHA=$(gh api "repos/$REPO/git/tags/$REF_OBJECT_SHA" --jq '.object.sha')
            else
              EXISTING_SHA="$REF_OBJECT_SHA"
            fi
            echo "::error::Tag $TAG is already reserved at $EXISTING_SHA (requested SHA: $PUBLISHED_SHA)." >&2
            echo "::error::Do not stage this version again. Recover its stage ID from workflow logs/npm, or keep the tag and prepare the next version." >&2
            exit 1
          fi
          gh api "repos/$REPO/git/refs" -X POST -f "ref=refs/tags/$TAG" -f "sha=$PUBLISHED_SHA"
          echo "Created tag $TAG at $PUBLISHED_SHA"

      # STAGED uploads: the tarball and its provenance land in npm's staging
      # area and NOTHING is public until a human approves each stage by ID
      # with `pnpm run approve:npm <stage-id>`. The
      # per-package trusted publishers allow "stage publish" ONLY — a direct
      # `npm publish` dies at the OIDC token exchange.
      #
      # Run the pinned pnpm from runner.temp: pnpm
      # self-delegates to a packageManager pin whenever its cwd sits under a
      # manifest, and the firewall shim guards inbound package fetches while
      # a stage upload is outbound. This job has neither a checkout nor a
      # shim, so both hazards are structurally absent.
      - name: Stage release packages
        working-directory: ${{ runner.temp }}
        env:
          FIRST_STAGE_TOKEN: ${{ contains(needs.verify.outputs.version, '-') && secrets.NPM_FIRST_STAGE_TOKEN || '' }}
          NPM_DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          first_stage_token=$FIRST_STAGE_TOKEN
          unset FIRST_STAGE_TOKEN
          shopt -s nullglob
          TARBALLS=("$RUNNER_TEMP"/dist/*.tgz)
          EXPECTED=$(node "$RUNNER_TEMP/verify-release.mts" tarball-count "${#TARBALLS[@]}")
          SUMMARY="$RUNNER_TEMP/npm-stage-summary.md"
          : > "$SUMMARY"
          # Stage platform packages first. The root launcher is approved last.
          if [[ "$VERSION" == *-* ]]; then
            TARBALLS=("$RUNNER_TEMP"/dist/socketsecurity-socket-cli-*.tgz "$RUNNER_TEMP/dist/socket-$VERSION.tgz")
          fi
          umask 077
          authfile=$(mktemp "$RUNNER_TEMP/npm-first-stage.XXXXXX")
          trap 'rm -f "$authfile"' EXIT
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$authfile"
          for tarball in "${TARBALLS[@]}"; do
            filename=$(basename "$tarball")
            echo "Staging $filename"
            (
              if [[ "$filename" == socketsecurity-socket-cli-* ]]; then
                slug=${filename%-$VERSION.tgz}
                name="@socketsecurity/${slug#socketsecurity-}"
                if grep -Fxq "$name" "$RUNNER_TEMP/first-native-packages"; then
                  export NODE_AUTH_TOKEN="$first_stage_token" NPM_CONFIG_USERCONFIG="$authfile"
                fi
              fi
              pnpm stage publish "$tarball" \
                --provenance --access public --tag "$NPM_DIST_TAG" --json
            ) > "$RUNNER_TEMP/npm-stage.json"
            node "$RUNNER_TEMP/verify-release.mts" stage-output "$RUNNER_TEMP/npm-stage.json" "$SUMMARY" "$tarball"
            tail -n 1 "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Staged $EXPECTED package(s). Approve each ID locally with: pnpm run approve:npm <stage-id>"

  # Prepare the next version and changelog. This job runs the installed
  # toolchain without write credentials and changes only package.json and
  # CHANGELOG.md.
  prepare:
    name: Prepare the release version
    if: ${{ inputs.mode == 'release-pr' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      patch: ${{ steps.patch.outputs.patch }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - *checkout-full-history
      - *release-tools
      - *setup-firewall
      - *install-dependencies

      - name: Prepare version and changelog
        id: bump
        env:
          RELEASE_AS: ${{ inputs.release-as }}
          SOCKET_CLI_RELEASE_MAJOR: ${{ inputs.release-major }}
        run: |
          node scripts/release/prepare.mts \
            ${RELEASE_AS:+--release-as "$RELEASE_AS"} \
            ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Export the bump as a patch
        if: ${{ inputs.dry-run == false }}
        id: patch
        run: |
          echo "patch=$(git diff --binary HEAD -- CHANGELOG.md package.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          git diff --stat HEAD

  # Commit the bump via the release App and open the release PR. This job
  # installs nothing, so no third-party code shares a job with the App token.
  release-pr:
    name: Open the release PR
    needs: prepare
    if: ${{ inputs.mode == 'release-pr' && inputs.dry-run == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # The bump commit's parent is github.sha, so a shallow checkout of it is
      # enough to apply the patch and read the base tree.
      - name: Checkout source
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: *checkout-shallow

      - name: Apply the bump
        env:
          PATCH_B64: ${{ needs.prepare.outputs.patch }}
        run: printf '%s' "$PATCH_B64" | base64 -d | git apply

      - name: Mint release App token
        id: release-app
        env:
          APP_PRIVATE_KEY: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          CLIENT_ID: ${{ vars.SOCKET_RELEASE_CLIENT_ID }}
          OWNER: ${{ github.repository_owner }}
          PERMISSIONS: '{"contents":"write","pull_requests":"write"}'
          REPOSITORIES: ${{ github.event.repository.name }}
        run: node scripts/release/mint-app-token.mjs

      - name: Commit the bump and open the release PR
        env:
          RELEASE_APP_TOKEN: ${{ steps.release-app.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/open-release-pr.mts --version "$VERSION"
