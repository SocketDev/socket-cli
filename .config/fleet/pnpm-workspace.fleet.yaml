# Fleet-canonical catalog — the single source of truth for catalog deps that
# EVERY fleet repo carries. The cascade splices this `catalog:` block into each
# repo's real pnpm-workspace.yaml (the wheelhouse's own included, via dogfood).
#
# NOT a pnpm config file — the `.fleet` infix keeps it from colliding with the
# real `pnpm-workspace.yaml` (pnpm's own discovery, the cascade's pnpm-workspace
# handling, and find-by-name tooling all key on the bare name). Same reason
# `vitest.coverage.fleet.config.mts` is infixed.
#
# Fleet vs repo: deps HERE are fleet-wide (present in every repo's catalog).
# Repo-specific catalog deps stay in that repo's own pnpm-workspace.yaml and are
# never cascaded. That split is the whole point of this file.
#
# Versions live here; the human-readable purpose for each lives alongside the
# name in FLEET_CANONICAL_CATALOG_NAMES (scripts/repo/sync-scaffolding/manifest.mts).
# loadExpectedCatalogEntries() reads versions from this file + merges the purpose.
catalog:
  '@redwoodjs/agent-ci': 0.17.1
  'dtu-github-actions': 0.17.1
  '@shadscan/cli': 0.7.0
  '@sinclair/typebox': 0.34.52
  # typebox 1.x — the unscoped rewrite of @sinclair/typebox. Both names are
  # pinned while the fleet migrates; the 0.x entry is deleted once no member
  # imports the scoped name.
  'typebox': 1.3.10
  '@socketregistry/packageurl-js': 1.5.2
  '@socketsecurity/lib': 6.6.0
  '@socketsecurity/registry': 2.0.5
  '@socketsecurity/sdk': 4.1.3
  '@socketregistry/packageurl-js-stable': 'npm:@socketregistry/packageurl-js@1.5.2'
  '@socketsecurity/lib-stable': 'npm:@socketsecurity/lib@6.6.0'
  '@socketsecurity/registry-stable': 'npm:@socketsecurity/registry@2.0.5'
  '@socketsecurity/sdk-stable': 'npm:@socketsecurity/sdk@4.1.3'
  '@types/mdast': 4.0.4
  '@types/node': 26.1.2
  '@types/semver': 7.7.1
  '@types/shell-quote': 1.7.5
  # Rust wasm parser artifact (dot-naming: acorn.rs.wasm = acorn, Rust impl,
  # wasm target) — the AST dep of the fleet hooks + the socket/* oxlint plugin.
  '@ultrathink/acorn.rs.wasm': 0.1.1
  # brace-expansion — pinned only so the interop patch can ride beside it.
  # 5.0.7 dropped the default export from BOTH builds: the CJS half breaks
  # minimatch@9's `__importDefault`, and the ESM half breaks any `import x from
  # 'brace-expansion'`, which is the shape the fleet CI cache action resolves
  # through. An unpatched member dies at setup before a test runs. Members had
  # drifted across 5.0.5 / 5.0.6 / 5.0.7 / 5.0.8, so the fleet converges here.
  #
  # 5.0.9 carries a HIGH advisory fix (DoS via unbounded intermediate arrays;
  # `<5.0.9` is vulnerable), so it is pulled ahead of the 7-day cooldown with a
  # dated minimumReleaseAgeExclude entry rather than left pinned to a version
  # `pnpm audit` fails on. patchedDependencies keys on this pin, so the
  # regenerated patches/brace-expansion@5.0.9.patch lands in the same change.
  'brace-expansion': 5.0.9
  # istanbul-org converter for raw NODE_V8_COVERAGE output — cover.mts turns
  # spawned-child coverage into the children merge tier with `c8 report`.
  # Soaked (11.0.0 published 2026-02-22).
  c8: 12.0.0
  # chrome-devtools-mcp — Puppeteer-based browser-automation MCP server. Drives
  # Chrome for HTML/design-system rendering + page-JS/console/network inspection
  # and MV3 extension load+eval (socket-webext). Enabled by default via .mcp.json
  # (`pnpm exec chrome-devtools-mcp`). Soaked (1.5.0 published 2026-07-03; 1.6.0
  # published 2026-07-14 is still inside the 7-day cooldown).
  'chrome-devtools-mcp': 1.6.0
  # compromise.js NLP — the judgment-nudge hook's modal-verb (POS) detector.
  # 14.15.1 is the attested re-publish that cleared the 14.15.0
  # trust-downgrade flag.
  'compromise': 14.16.0
  # fast-check — property-based testing (QuickCheck for JS) for pure fleet-script
  # logic; runs standalone in vitest. Soaked (4.9.0 published 2026-07-08). See
  # .claude/skills/fleet/property-and-fuzz-testing.
  'fast-check': 4.9.0
  'magic-string': 1.1.0
  'markdownlint-cli2': 0.23.2
  'mdast-util-from-markdown': 2.0.3
  'micromark': 4.0.2
  # minimatch — pinned so the default-export patch has a version to ride, and
  # so the `minimatch@>=3` override has one target. v10's ESM build ships named
  # exports only; the patch restores the default on both builds. Members had
  # drifted across 3.1.5, 9.0.9, and 10.2.5 at the same time.
  #
  # patchedDependencies keys on this value, so moving it without regenerating
  # the patch names a file that is not there and every `pnpm install` in the
  # repo dies ENOENT. A bump lands the regenerated
  # patches/minimatch@<version>.patch in the SAME change.
  'minimatch': 10.2.6
  'neosanitize': 0.3.0
  # Pinned back 15.0.0 -> 14.0.16 on 2026-07-27: 15.0.0 ships
  # @mswjs/interceptors 0.39.8, whose fetch bypass path clones an
  # already-consumed request and throws TypeError: unusable on any fetch
  # POST-with-body to an enableNetConnect-allowed host — broke the
  # odai and socket-mcp Test jobs. 14.0.16 is the same
  # interceptors-based API family — static replies, scope.on('request')
  # capture, no 2-arity reply functions, no this.req — published
  # 2026-06-26, past soak, and passes the regression repro. Upstream
  # marks 15.0.0 deprecated as "released accidentally" and the fix lives
  # in 15.0.0-beta.14, a beta still inside the 7-day soak; bump to the
  # stabilized 15.x when it ships.
  'nock': 14.0.16
  # npm-high-impact 1.13.0 — wooorm's high-impact npm package lists
  # (npmHighImpact + npmTopDependents + npmTopDownloads); the ecosystem-reach
  # input for scripts/fleet/measure-ecosystem-impact.mts, which ranks override
  # candidates before simulating what a port actually cuts. Published
  # 2026-06-08, past the 7-day soak.
  'npm-high-impact': 1.13.0
  'npm-run-all2': 9.0.2
  'oxfmt': 0.62.0
  'oxlint': 1.77.0
  # oxlint-tsgolint — tsgolint sidecar for oxlint --type-aware (same oxc release train).
  'oxlint-tsgolint': 7.0.2001
  # playwright-core — headless Chromium driver for the rendering-chromium-to-png
  # skill (render a page or a real unpacked MV3 extension popup to PNG so an
  # agent can SEE it). Browser binary via `node_modules/.bin/playwright install chromium`.
  'playwright-core': 1.62.0
  # portless — stable HTTPS `.localhost` URLs for local page tests and rendered UI checks.
  'portless': 0.15.4
  'regjsparser': 0.13.2
  'semver': 7.8.5
  'shell-quote': 1.10.0
  'taze': 19.17.1
  # TypeScript 7 NATIVE (the Go `tsc`). Track the highest available 7.x
  # PRE-RELEASE — the RC line is intentional. npm's `latest` dist-tag points at
  # 6.x stable, so "latest" is a DOWNGRADE off the native compiler: never follow
  # it. Bump only to a newer `7.x-rc`/`7.x` (7 > 6, and a real 7.x release when
  # it ships outranks the rc). Pinned-toolchain, excluded from taze
  # (UPDATE_PINNED_TOOLCHAIN) so it is never auto-bumped — always a deliberate bump.
  'typescript': 7.0.2
  'vitest': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10

# Optional fleet catalog — present in repos that use these tools; absent is
# fine (the cascade never injects these). Read by loadOptionalCatalogEntries()
# (manifest/catalog.mts) and the fleet doctor (scripts/fleet/doctor.mts) to
# resolve versions for catalog: refs that are missing their catalog entry.
catalogOptional:
  'rolldown': 1.2.3
  # rolldown-plugin-dts — build-time declaration emit for the dep-0 bootstrap
  # bundle (scripts/repo/gen/bootstrap.mts): bundles a single self-contained
  # fleet.d.mts beside fleet.mjs so the typed source's consumers resolve types
  # without a hand-maintained declaration. Wheelhouse-only (only the wheelhouse
  # builds the bundle); soak-bypassed at 0.28.0 (build-only dev tool, never
  # shipped to runtime) per RELEASE_AGE_EXCLUDE_ANNOTATIONS.
  'rolldown-plugin-dts': 0.28.0
  'svgo': 4.0.2
  # vitiate — coverage-guided fuzzer (SWC-instrumented, native @vitiate/engine).
  # Optional tier: adopted only in repos that fuzz an input boundary (parsers,
  # decoders, native addons), so its native @swc/core engine never installs
  # fleet-wide. Pinned to the published 0.3.1 (soaked 2026-06-22). NOTE: 0.4.0
  # changes the crash exit code 1→77 (timeout→70) — pin -error_exitcode /
  # -timeout_exitcode in the runner. See .claude/skills/fleet/property-and-fuzz-testing.
  '@vitiate/core': 0.3.1
  'vite': 8.1.5
  'vitiate': 0.3.1

# Soak-window bypasses — a dependency the fleet adopts before its -day
# cooldown elapses. The date is when the version was PUBLISHED; the day it
# becomes removable is derived (published + the soak window), never stored,
# so the two can never disagree.
#
# This block is the single dated source of truth. EXPECTED_RELEASE_AGE_EXCLUDE
# is its key set, and synth-workspace-yaml renders each entry into the real
# pnpm-workspace.yaml as a pnpm-legal string with a dated comment. pnpm never
# reads THIS file, which is why the dates can live here as real data instead of
# in a comment.
#
# To clear a soaked entry, delete its line here.
