  '@shadscan/cli': 0.16.0
  '@sinclair/typebox': 0.34.52
  'ecc-agentshield': 1.4.0
  'run-local-ci': 0.18.1
  # typebox 1.x — the unscoped rewrite of @sinclair/typebox. Both names are
  # pinned while the fleet migrates; the 0.x entry is deleted once no member
